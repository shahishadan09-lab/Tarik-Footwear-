  // settings screen from a page — that's intentionally locked down for
  // security. intent:// works in some Android/Chrome configurations but is
  // not reliable across all devices, so we give clear manual steps instead
  // rather than promising a jump that might silently fail on some phones.
  showToast(SETTINGS.lang==='hi'
    ? 'फ़ोन की Settings ऐप खोलें → Bluetooth → स्कैनर पेयर करें'
    : "Open your phone's Settings app → Bluetooth → pair your scanner", 4500);
}

/* Backward-compatible alias: existing call sites (e.g. the More menu) still
   reference openPrinterConnectSheet by name. */
function openPrinterConnectSheet(){ openConnectDevicesSheet(); }

/* ---------------- BLUETOOTH CONNECT ---------------- */
async function connectBluetoothPrinter(){
  const statusEl = document.getElementById('thermal-status');
  if(!navigator.bluetooth){
    statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'यह ब्राउज़र Bluetooth प्रिंटर सपोर्ट नहीं करता। Chrome इस्तेमाल करें।':'This browser does not support Bluetooth printers. Use Chrome.'}</div>`;
    return;
  }
  statusEl.innerHTML = `<div class="card" style="text-align:center;">${SETTINGS.lang==='hi'?'डिवाइस ढूंढे जा रहे हैं...':'Searching for devices...'}</div>`;
  try{
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: THERMAL_BT_SERVICE_UUIDS
    });
    statusEl.innerHTML = `<div class="card" style="text-align:center;">${SETTINGS.lang==='hi'?'कनेक्ट हो रहा है...':'Connecting...'}</div>`;
    const server = await device.gatt.connect();

    let characteristic = null;
    for(const serviceUuid of THERMAL_BT_SERVICE_UUIDS){
      try{
        const service = await server.getPrimaryService(serviceUuid);
        const characteristics = await service.getCharacteristics();
        // Pick the first writable characteristic — this is where ESC/POS bytes go.
        characteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse) || characteristics[0];
        if(characteristic) break;
      }catch(e){ /* try next known service UUID */ }
    }

    if(!characteristic){
      statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'यह प्रिंटर सपोर्ट नहीं हो पाया। कोशिश करें या ब्राउज़र Print Dialog इस्तेमाल करें।':'This printer could not be supported. Try again or use the browser Print dialog instead.'}</div>`;
      return;
    }

    _thermalDevice = device;
    _thermalConnectionType = 'bluetooth';
    _thermalCharacteristic = characteristic;
    _lastBluetoothDevice = device;
    _manualDisconnect = false;
    _reconnectAttempts = 0;
    device.addEventListener('gattserverdisconnected', onThermalPrinterDisconnected);
    startKeepAlive();
    acquireWakeLock();

    showToast((SETTINGS.lang==='hi'?'प्रिंटर कनेक्ट हो गया: ':'Printer connected: ')+(device.name||'Printer'));
    openConnectDevicesSheet();
  }catch(err){
    if(err.name === 'NotFoundError'){
      statusEl.innerHTML = ''; // user cancelled the device picker, no error needed
    } else {
      statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'कनेक्ट नहीं हो पाया':'Could not connect'}: ${esc(err.message||'')}</div>`;
    }
  }
}

/* ---------------- USB CONNECT ---------------- */
async function connectUSBPrinter(){
  const statusEl = document.getElementById('thermal-status');
  if(!navigator.usb){
    statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'यह ब्राउज़र USB प्रिंटर सपोर्ट नहीं करता। Chrome इस्तेमाल करें।':'This browser does not support USB printers. Use Chrome.'}</div>`;
    return;
  }
  statusEl.innerHTML = `<div class="card" style="text-align:center;">${SETTINGS.lang==='hi'?'USB डिवाइस ढूंढे जा रहे हैं...':'Searching for USB device...'}</div>`;
  try{
    const device = await navigator.usb.requestDevice({filters: []});
    await device.open();
    if(device.configuration === null){
      await device.selectConfiguration(1);
    }
    // Find the first interface with an OUT endpoint — that's where print data goes.
    let foundInterface = null;
    for(const iface of device.configuration.interfaces){
      const alt = iface.alternates[0];
      const outEndpoint = alt.endpoints.find(e => e.direction === 'out');
      if(outEndpoint){
        foundInterface = {interfaceNumber: iface.interfaceNumber, endpointNumber: outEndpoint.endpointNumber};
        break;
      }
    }
    if(!foundInterface){
      statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'इस प्रिंटर का प्रिंट पोर्ट नहीं मिला':'Could not find a print port on this device'}</div>`;
      return;
    }
    await device.claimInterface(foundInterface.interfaceNumber);

    _thermalDevice = device;
    _thermalConnectionType = 'usb';
    _thermalUsbInterface = foundInterface;
    navigator.usb.addEventListener('disconnect', (event)=>{
      if(event.device === device) onThermalPrinterDisconnected();
    });

    showToast((SETTINGS.lang==='hi'?'USB प्रिंटर कनेक्ट हो गया':'USB printer connected'));
    openConnectDevicesSheet();
  }catch(err){
    if(err.name === 'NotFoundError'){
      statusEl.innerHTML = '';
    } else {
      statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'कनेक्ट नहीं हो पाया':'Could not connect'}: ${esc(err.message||'')}</div>`;
    }
  }
}

function onThermalPrinterDisconnected(){
  stopKeepAlive();
  releaseWakeLock();
  const wasBluetooth = _thermalConnectionType === 'bluetooth';
  if(_isPrinting){
    // The printer was mid-way through receiving a print job (very likely a
    // raster image, which arrives as many chunks) when the connection
    // dropped. Its internal state now doesn't know the image ended partway
    // through — if we just reconnect and carry on sending new data (a
    // keep-alive byte, the next label, anything), the printer keeps
    // "expecting" leftover image bytes and misreads whatever comes next as
    // image data, producing garbage text for the rest of the roll. An
    // explicit reset command must be the very first thing sent after
    // reconnecting, before anything else.
    _printWasInterrupted = true;
    _isPrinting = false;
    showToast(SETTINGS.lang==='hi'?'⚠️ प्रिंट अधूरा रह गया — प्रिंटर बीच में डिसकनेक्ट हो गया':'⚠️ Print was interrupted — printer disconnected mid-job', 4000);
  }
  _thermalDevice = null;
  _thermalConnectionType = null;
  _thermalCharacteristic = null;
  _thermalUsbInterface = null;

  if(_manualDisconnect || !wasBluetooth || !_lastBluetoothDevice){
    if(!_printWasInterrupted) showToast(SETTINGS.lang==='hi'?'प्रिंटर डिसकनेक्ट हो गया':'Printer disconnected');
    _manualDisconnect = false;
    return;
  }
  // Unexpected drop (not the user tapping Disconnect) — try reconnecting to
  // the same device automatically a few times before giving up and asking
  // the cashier to reconnect manually. The device stays "remembered" by the
  // browser after the first pairing, so this doesn't need the device picker.
  attemptAutoReconnect();
}

async function attemptAutoReconnect(){
  if(_reconnectAttempts >= 5){
    _reconnectAttempts = 0;
    showToast(SETTINGS.lang==='hi'?'प्रिंटर डिसकनेक्ट हो गया — दोबारा कनेक्ट करें':'Printer disconnected — please reconnect', 4000);
    return;
  }
  _reconnectAttempts++;
  const delay = Math.min(1000 * _reconnectAttempts, 5000);
  await new Promise(r=>setTimeout(r, delay));
  try{
    if(!_lastBluetoothDevice) return;
    const server = await _lastBluetoothDevice.gatt.connect();
    let characteristic = null;
    for(const serviceUuid of THERMAL_BT_SERVICE_UUIDS){
      try{
        const service = await server.getPrimaryService(serviceUuid);
        const characteristics = await service.getCharacteristics();
        characteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse) || characteristics[0];
        if(characteristic) break;
      }catch(e){ /* try next known service UUID */ }
    }
    if(!characteristic) throw new Error('no characteristic');
    _thermalDevice = _lastBluetoothDevice;
    _thermalConnectionType = 'bluetooth';
    _thermalCharacteristic = characteristic;
    _reconnectAttempts = 0;
    if(_printWasInterrupted){
      // Force the printer back to a clean known state before anything else
      // goes out — without this, it keeps interpreting new bytes as the
      // leftover half of the image it never finished receiving, and prints
      // garbage indefinitely.
      try{ await sendBytesToThermalPrinter(escposInit()); }catch(e){}
      _printWasInterrupted = false;
      showToast(SETTINGS.lang==='hi'?'प्रिंटर रीसेट हो गया — कृपया लेबल दोबारा प्रिंट करें':'Printer reset — please reprint the label', 4000);
    } else {
      showToast(SETTINGS.lang==='hi'?'प्रिंटर अपने आप दोबारा कनेक्ट हो गया':'Printer reconnected automatically');
    }
    startKeepAlive();
    acquireWakeLock();
  }catch(e){
    attemptAutoReconnect(); // keep retrying, up to the cap above
  }
}

function disconnectThermalPrinter(){
  _manualDisconnect = true;
  _lastBluetoothDevice = null;
  try{
    if(_thermalConnectionType === 'bluetooth' && _thermalDevice && _thermalDevice.gatt.connected){
      _thermalDevice.gatt.disconnect();
    } else if(_thermalConnectionType === 'usb' && _thermalDevice){
      _thermalDevice.close();
    }
  }catch(e){ /* ignore — we're tearing down the connection either way */ }
  onThermalPrinterDisconnected();
  openConnectDevicesSheet();
}

/* ---------------- SENDING DATA TO THE PRINTER ---------------- */
async function sendBytesToThermalPrinter(bytes){
  // Kept for any caller that already has one flat buffer — wraps it as a
  // single segment so it goes through the same safe packing logic below.
  await sendSegmentsToThermalPrinter([bytes]);
}

async function sendSegmentsToThermalPrinter(segments){
  if(!_thermalDevice) throw new Error(SETTINGS.lang==='hi'?'कोई प्रिंटर कनेक्ट नहीं है':'No printer connected');
  _isPrinting = (_isPrinting|0) + 1;
  try{
    await _sendSegmentsToThermalPrinterInner(segments);
  } finally {
    _isPrinting = Math.max(0, (_isPrinting|0) - 1);
  }
}
async function _sendSegmentsToThermalPrinterInner(segments){
  // Bluetooth has a per-write size limit on most printer chipsets (~180-200 bytes
  // is safe), so long receipts/labels are sent in chunks rather than one write.
  const CHUNK_SIZE = 180;

  if(_thermalConnectionType === 'usb'){
    // USB has no such per-write limit — send everything as one transfer.
    await _thermalDevice.transferOut(_thermalUsbInterface.endpointNumber, concatBytes(segments));
    return;
  }

  // Pack whole segments into each chunk, never splitting a segment across two
  // chunks. A "segment" here is one logical ESC/POS command or text line
  // (e.g. the barcode command's header+data bytes together). Splitting a
  // single command mid-way across two separate BLE writes — even with a
  // gap in between — is what was silently truncating the last byte(s) of
  // whichever command happened to straddle the 180-byte boundary; on these
  // labels that was consistently the barcode command, since it sits at a
  // fairly fixed offset after the shop name / product name text.
  const chunks = [];
  let current = [];
  let currentLen = 0;
  segments.forEach(seg=>{
    if(seg.length > CHUNK_SIZE){
      // A single segment bigger than one chunk (shouldn't happen for our
      // short commands/lines, but guard against it) — flush what's queued,
      // then send this oversized one on its own.
      if(current.length){ chunks.push(concatBytes(current)); current=[]; currentLen=0; }
      chunks.push(seg);
      return;
    }
    if(currentLen + seg.length > CHUNK_SIZE){
      chunks.push(concatBytes(current));
      current = [seg];
      currentLen = seg.length;
    } else {
      current.push(seg);
      currentLen += seg.length;
    }
  });
  if(current.length) chunks.push(concatBytes(current));

  for(const chunk of chunks){
    // If a disconnect happened between chunks (caught by the GATT event
    // listener elsewhere), _thermalDevice is now null — stop immediately
    // instead of throwing on a stale characteristic reference.
    if(!_thermalDevice || !_thermalCharacteristic){
      throw new Error(SETTINGS.lang==='hi'?'प्रिंट के बीच में कनेक्शन टूट गया':'Connection dropped mid-print');
    }
    // Prefer an acknowledged write (writeValue) when the printer supports
    // it — it waits for the GATT-level ack before returning, so the next
    // chunk can't be sent until this one is confirmed received.
    if(_thermalCharacteristic.properties.write){
      await _thermalCharacteristic.writeValue(chunk);
    } else if(_thermalCharacteristic.properties.writeWithoutResponse){
      await _thermalCharacteristic.writeValueWithoutResponse(chunk);
      // No acknowledgment available on this characteristic — add a short
      // gap so the printer's buffer can drain before the next chunk hits.
      await new Promise(r => setTimeout(r, 20));
    }
  }
}

/* ---------------- ESC/POS COMMAND BUILDERS ---------------- */
const ESC = 0x1B, GS = 0x1D;
function escposInit(){ return new Uint8Array([ESC, 0x40]); } // initialize printer
function escposAlign(mode){ // 0=left, 1=center, 2=right
  return new Uint8Array([ESC, 0x61, mode]);
}
function escposBold(on){ return new Uint8Array([ESC, 0x45, on?1:0]); }
function escposDoubleSize(on){ return new Uint8Array([GS, 0x21, on?0x11:0x00]); }
function escposFeed(lines){ return new Uint8Array([ESC, 0x64, lines]); }
function escposFeedDots(dots){ return new Uint8Array([ESC, 0x4A, Math.min(255, Math.max(0, dots))]); } // ESC J n — feeds n/180 inch, precise regardless of line-height setting
function escposCut(){ return new Uint8Array([GS, 0x56, 0x00]); }
function textToBytes(str){
  // Plain ASCII/Latin-1 encoding covers the digits, currency-less totals, and
  // English text our receipts use; Hindi text on the receipt would need a
  // different printer codepage, so receipts print in English regardless of
  // the app's current display language — this keeps printing reliable across
  // the widest range of cheap thermal printers, which mostly don't support
  // Devanagari fonts at all.
  const bytes = [];
  for(let i=0;i<str.length;i++){
    const code = str.charCodeAt(i);
    bytes.push(code < 256 ? code : 0x3F); // unsupported chars print as '?'
  }
  return new Uint8Array(bytes);
}
function concatBytes(arrays){
  const total = arrays.reduce((sum,a)=>sum+a.length, 0);
  const result = new Uint8Array(total);
  let offset = 0;
  arrays.forEach(a => { result.set(a, offset); offset += a.length; });
  return result;
}

/* ---------------- BUILD + SEND RECEIPT ---------------- */
function containsNonAscii(str){
  return /[^\x00-\x7F]/.test(str);
}

/* Renders one line of text to a canvas and converts it to ESC/POS raster
   segments — used only when the line contains non-ASCII characters. These
   cheap thermal printers only have an ASCII font built into their firmware;
   Hindi/Devanagari text sent as plain bytes prints as "?" for every
   character, since there's no glyph on the printer's end for those byte
   values. Drawing the text ourselves with a font that does support
   Devanagari (already loaded for the app's own UI) and printing it as an
   image sidesteps the printer's font entirely — same idea as the barcode. */
async function renderTextLineAsRasterSegments(text, opts){
  opts = opts || {};
  const fontSize = opts.fontSize || 30;
  const bold = opts.bold ? 'bold ' : '';
  const printWidthPx = 384; // ~58mm printable width at 203dpi
  const fontSpec = `${bold}${fontSize}px 'Noto Sans Devanagari', sans-serif`;
  try{ await document.fonts.load(fontSpec); }catch(e){ /* proceed with fallback font if this fails */ }

  const measure = document.createElement('canvas').getContext('2d');
  measure.font = fontSpec;
  const textWidth = Math.ceil(measure.measureText(text).width);

  const canvas = document.createElement('canvas');
  canvas.width = Math.min(printWidthPx, Math.max(10, textWidth + 8));
  canvas.height = Math.ceil(fontSize * 1.5);
  const ctx = canvas.getContext('2d');
  ctx.font = fontSpec;
  ctx.fillStyle = '#000';
  ctx.textBaseline = 'top';
  ctx.fillText(text, 2, 2);

  const width = canvas.width, height = canvas.height;
  const bytesPerRow = Math.ceil(width/8);
  const img = ctx.getImageData(0,0,width,height).data;
  const segments = [];
  const xL = bytesPerRow & 0xFF, xH = (bytesPerRow>>8) & 0xFF;
  const yL = height & 0xFF, yH = (height>>8) & 0xFF;
  segments.push(new Uint8Array([GS, 0x76, 0x30, 0, xL, xH, yL, yH]));
  for(let y=0; y<height; y++){
    const row = new Uint8Array(bytesPerRow);
    for(let x=0; x<width; x++){
      const idx = (y*width+x)*4;
      const luminance = (img[idx]+img[idx+1]+img[idx+2])/3;
      if(luminance < 128 && img[idx+3] > 64){ row[x>>3] |= (0x80 >> (x%8)); }
    }
    segments.push(row);
  }
  return segments;
}

/* Returns printable segments for one line of text: plain ESC/POS text bytes
   for ASCII (fast, tiny — the common case for prices, dates, SKUs), or a
   rendered image for any line containing Hindi (see above). Always ends
   with a line feed, matching how textToBytes(x+'\n') was used before. */
async function textLine(text, opts){
  text = String(text==null ? '' : text);
  if(!containsNonAscii(text)) return [textToBytes(text + '\n')];
  const segs = await renderTextLineAsRasterSegments(text, opts);
  segs.push(new Uint8Array([0x0A]));
  return segs;
}

async function printReceiptThermal(sale){
  const shopName = (SETTINGS.shopName||'Tariq Footwear').toUpperCase();
  const lines = [];
  lines.push(escposInit());
  lines.push(escposAlign(1), escposBold(true), escposDoubleSize(true));
  lines.push(...(await textLine(shopName, {bold:true, fontSize:34})));
  lines.push(escposDoubleSize(false), escposBold(false));
  lines.push(textToBytes('Style . Comfort . Quality\n'));
  if(SETTINGS.shopAddress) lines.push(...(await textLine(SETTINGS.shopAddress)));
  if(SETTINGS.shopPhone) lines.push(textToBytes('Tel: '+SETTINGS.shopPhone+'\n'));
  lines.push(textToBytes('--------------------------------\n'));
  lines.push(escposAlign(0));
  lines.push(textToBytes('Bill No: '+sale.billNo+'\n'));
  lines.push(textToBytes('Date: '+fmtDateTime(sale.dateISO)+'\n'));
  if(sale.customerName) lines.push(...(await textLine('Customer: '+sale.customerName)));
  lines.push(textToBytes('--------------------------------\n'));

  for(const it of sale.items){
    const nameLine = it.name.length>26 ? it.name.slice(0,26) : it.name;
    lines.push(...(await textLine(nameLine)));
    const qtyPrice = `${it.qty} x Rs.${Number(it.price).toLocaleString('en-IN')}`;
    const amount = `Rs.${(it.qty*it.price).toLocaleString('en-IN')}`;
    const padded = qtyPrice + ' '.repeat(Math.max(1, 32-qtyPrice.length-amount.length)) + amount;
    lines.push(textToBytes(padded+'\n'));
  }

  lines.push(textToBytes('--------------------------------\n'));
  lines.push(textToBytes(padLine('Subtotal', 'Rs.'+Number(sale.subtotal).toLocaleString('en-IN'))+'\n'));
  if(sale.discount>0) lines.push(textToBytes(padLine('Discount'+(sale.discountPct>0?' ('+sale.discountPct+'% OFF)':''), '-Rs.'+Number(sale.discount).toLocaleString('en-IN'))+'\n'));
  if(sale.gstAmount>0) lines.push(textToBytes(padLine(`GST (${sale.gstPercent}%)`, '+Rs.'+Number(sale.gstAmount).toLocaleString('en-IN'))+'\n'));
  lines.push(escposBold(true));
  lines.push(textToBytes(padLine('TOTAL', 'Rs.'+Number(sale.total).toLocaleString('en-IN'))+'\n'));
  lines.push(escposBold(false));
  if(Number(sale.creditAmount||0) > 0){
    lines.push(textToBytes(padLine('Paid', 'Rs.'+Number(sale.amountPaid).toLocaleString('en-IN'))+'\n'));
    lines.push(escposBold(true));
    lines.push(textToBytes(padLine('UDHAAR DUE', 'Rs.'+Number(sale.creditAmount).toLocaleString('en-IN'))+'\n'));
    lines.push(escposBold(false));
  }
  lines.push(textToBytes('--------------------------------\n'));
  lines.push(escposAlign(1));
  lines.push(...(await textLine('Payment: '+paymentModeLabel(sale.paymentMode))));
  lines.push(textToBytes('\n'));
  lines.push(textToBytes('Thank you for shopping with us!\n'));
  lines.push(textToBytes('Exchange within 7 days with bill.\n'));
  lines.push(escposFeed(3));
  lines.push(escposCut());

  await sendSegmentsToThermalPrinter(lines);
}
function padLine(label, value){
  const total = 32;
  const spaces = Math.max(1, total - label.length - value.length);
  return label + ' '.repeat(spaces) + value;
}

/* ---------------- BUILD + SEND BARCODE LABEL ---------------- */
let _jsBarcodeLoadPromise = null;
function ensureJsBarcodeLoaded(){
  if(window.JsBarcode) return Promise.resolve();
  if(_jsBarcodeLoadPromise) return _jsBarcodeLoadPromise;
  _jsBarcodeLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ _jsBarcodeLoadPromise = null; reject(new Error(SETTINGS.lang==='hi'?'बारकोड लाइब्रेरी लोड नहीं हो सकी — इंटरनेट चेक करें':'Could not load barcode library — check internet')); };
    document.head.appendChild(s);
  });
  return _jsBarcodeLoadPromise;
}

/* Renders the barcode as actual pixels (via JsBarcode, the same well-tested
   library already used for the browser-print label) and converts those
   pixels directly into ESC/POS raster image bytes (GS v 0). Returns an
   array of small segments — an 8-byte header, then one segment per pixel
   row — so sendSegmentsToThermalPrinter can pack them safely into normal
   BLE-sized chunks instead of one giant write. */
async function generateBarcodeRasterSegments(value, targetWidthPx){
  await ensureJsBarcodeLoaded();
  const canvas = document.createElement('canvas');
  JsBarcode(canvas, value, { format:'CODE128', displayValue:false, margin:8, width:2, height:70 });

  // Scale bars to the target print width so every label prints the barcode
  // at a consistent, predictable size regardless of how wide JsBarcode's
  // default rendering came out for this particular value.
  const barsScale = targetWidthPx / canvas.width;
  const barsHeight = Math.round(canvas.height * barsScale);

  // The human-readable digits used to be sent as a separate text write
  // right after this image — and that separate write was consistently
  // losing its last character on this printer (a buffer/timing quirk
  // specific to writes that immediately follow a large raster image, not
  // something further BLE-chunk tuning fixed). Drawing the digits directly
  // onto this same canvas, below the bars, means they're just more pixels
  // in the one image already being sent — there's no longer a separate
  // trailing write for anything to drop.
  const textHeight = 34;
  const combined = document.createElement('canvas');
  combined.width = targetWidthPx;
  combined.height = barsHeight + textHeight;
  const cctx = combined.getContext('2d');
  cctx.fillStyle = '#fff';
  cctx.fillRect(0, 0, combined.width, combined.height);
  cctx.imageSmoothingEnabled = false; // keep bars crisp, no anti-aliased grey edges
  cctx.drawImage(canvas, 0, 0, targetWidthPx, barsHeight);
  cctx.fillStyle = '#000';
  cctx.font = "24px 'Inter', sans-serif";
  cctx.textAlign = 'center';
  cctx.textBaseline = 'top';
  cctx.fillText(value, targetWidthPx/2, barsHeight + 4);

  const width = combined.width, height = combined.height;
  const bytesPerRow = Math.ceil(width/8);
  const img = cctx.getImageData(0,0,width,height).data;

  const segments = [];
  const xL = bytesPerRow & 0xFF, xH = (bytesPerRow>>8) & 0xFF;
  const yL = height & 0xFF, yH = (height>>8) & 0xFF;
  segments.push(new Uint8Array([GS, 0x76, 0x30, 0, xL, xH, yL, yH])); // GS v 0 — raster bit image header

  for(let y=0; y<height; y++){
    const row = new Uint8Array(bytesPerRow);
    for(let x=0; x<width; x++){
      const idx = (y*width+x)*4;
      const luminance = (img[idx]+img[idx+1]+img[idx+2])/3;
      if(luminance < 128){ row[x>>3] |= (0x80 >> (x%8)); } // 1 bit = print a dot (black)
    }
    segments.push(row);
  }
  return segments;
}

/* Renders the ENTIRE label (name, barcode, SKU, price) as one combined
   image sized to an exact physical 50mm x 25mm label — the standard
   pre-cut sticker size — instead of separate text/image writes. This does
   two things at once: (1) guarantees the physical print size regardless of
   printer defaults, and (2) avoids ever sending a separate trailing text
   write after an image again, which is what was dropping characters on
   this printer before. Assumes 203dpi (8 dots/mm), the standard resolution
   for budget thermal printers — if labels come out a slightly different
   physical size than 50x25mm on your specific unit, its real DPI differs
   and this ratio needs adjusting. */
async function generateFullLabelRasterSegments(product){
  await ensureJsBarcodeLoaded();
  const DPI = 203;
  const mmToPx = mm => Math.round(mm * DPI / 25.4);
  const widthPx = mmToPx(50);
  const heightPx = mmToPx(25);
  const M = 5; // outer margin inside the border

  const canvas = document.createElement('canvas');
  canvas.width = widthPx;
  canvas.height = heightPx;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, widthPx, heightPx);
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000';

  // Thin border — reads as an intentional printed card rather than raw
  // text/bars floating on the paper.
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(1, 1, widthPx-2, heightPx-2);

  const innerW = widthPx - M*2;
  let y = M + 2;

  // Header row: shop mark (left) + SKU (right), small — identifies the tag
  // without competing with the price/barcode for attention.
  ctx.font = "bold 11px 'Inter', sans-serif";
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillText((SETTINGS.shopName||'TARIQ FOOTWEAR').toUpperCase(), M, y);
  ctx.textAlign = 'right';
  ctx.fillText(`SKU ${product.sku}`, widthPx-M, y);
  y += 13;
  ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(widthPx-M, y); ctx.lineWidth = 0.75; ctx.stroke();
  y += 4;

  // Product name — one line, truncated to fit; centered for a tidy,
  // symmetrical card look.
  const nameFontSpec = "600 14px 'Noto Sans Devanagari', 'Inter', sans-serif";
  try{ await document.fonts.load(nameFontSpec); }catch(e){}
  ctx.font = nameFontSpec;
  ctx.textAlign = 'center';
  let nameText = `${product.brand} ${product.name}`.trim();
  while(ctx.measureText(nameText).width > innerW && nameText.length > 3){
    nameText = nameText.slice(0, -2) + '…';
  }
  ctx.fillText(nameText, widthPx/2, y);
  y += 18;

  // Barcode block — the largest single element, since scan reliability
  // matters more than anything else on the card.
  const priceRowH = 34;
  const barcodeBlockH = heightPx - y - priceRowH - M;
  const digitsH = 14;
  const barsH = barcodeBlockH - digitsH;
  const barsCanvas = document.createElement('canvas');
  JsBarcode(barsCanvas, String(product.barcode), { format:'CODE128', displayValue:false, margin:2, width:2, height:70 });
  const barsW = innerW - 10;
  ctx.drawImage(barsCanvas, 0, 0, barsCanvas.width, barsCanvas.height, M+5, y, barsW, barsH);
  ctx.font = "11px 'Inter', sans-serif";
  ctx.fillText(String(product.barcode), widthPx/2, y+barsH+2);
  y += barcodeBlockH + 3;

  // Price — the focal point of the whole card: largest, boldest element,
  // set off by a thin rule above it.
  ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(widthPx-M, y); ctx.lineWidth = 0.75; ctx.stroke();
  y += 3;
  const priceText = `Rs.${Number(product.sellingPrice).toLocaleString('en-IN')}`;
  let priceFontSize = 24;
  try{ await document.fonts.load(`800 ${priceFontSize}px 'Inter'`); }catch(e){}
  ctx.font = `800 ${priceFontSize}px 'Inter', sans-serif`;
  while(ctx.measureText(priceText).width > innerW - 4 && priceFontSize > 14){
    priceFontSize -= 1;
    ctx.font = `800 ${priceFontSize}px 'Inter', sans-serif`;
  }
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillText(priceText, widthPx/2, y);

  const bytesPerRow = Math.ceil(widthPx/8);
  const img = ctx.getImageData(0,0,widthPx,heightPx).data;
  const segments = [];
  const xL = bytesPerRow & 0xFF, xH = (bytesPerRow>>8) & 0xFF;
  const yL = heightPx & 0xFF, yH = (heightPx>>8) & 0xFF;
  segments.push(new Uint8Array([GS, 0x76, 0x30, 0, xL, xH, yL, yH]));
  for(let py=0; py<heightPx; py++){
    const row = new Uint8Array(bytesPerRow);
    for(let x=0; x<widthPx; x++){
      const idx = (py*widthPx+x)*4;
      const luminance = (img[idx]+img[idx+1]+img[idx+2])/3;
      if(luminance < 128){ row[x>>3] |= (0x80 >> (x%8)); }
    }
    segments.push(row);
  }
  return segments;
}

async function printBarcodeLabelThermal(product){
  const lines = [];
  lines.push(escposInit());
  lines.push(escposAlign(1));
  const labelSegments = await generateFullLabelRasterSegments(product);
  labelSegments.forEach(seg=>lines.push(seg));
  lines.push(escposFeedDots(43)); // ~6mm precise gap — was ~1mm with line-based feed, not
                                    // enough clearance to tear labels apart cleanly by hand
  lines.push(escposCut());

  await sendSegmentsToThermalPrinter(lines);
}

async function printBarcodeLabelsBulkSmart(products){
  if(isPrinterConnected()){
    try{
      showToast((SETTINGS.lang==='hi'?'प्रिंट हो रहा है: ':'Printing: ')+products.length+(SETTINGS.lang==='hi'?' लेबल':' labels'));
      for(const p of products){
        await printBarcodeLabelThermal(p);
        // Small pause between labels so the printer's buffer keeps up and
        // labels don't overlap or get dropped on slower thermal printers.
        await new Promise(r=>setTimeout(r, 350));
      }
      return;
    }catch(err){
      showToast(SETTINGS.lang==='hi'?'प्रिंटर में समस्या, ब्राउज़र प्रिंट इस्तेमाल हो रहा है':'Printer issue, falling back to browser print');
    }
  }
  printBarcodeLabels(products); // original window.open-based print, from barcode.js
}

function submitPurchase(productId){
  const qty = parseInt(document.getElementById('pur-qty').value)||0;
  const cost = parseFloat(document.getElementById('pur-cost').value)||0;
  const supplier = document.getElementById('pur-supplier').value.trim();
  const notes = document.getElementById('pur-notes').value.trim();
  if(qty<=0){ showToast(t('common.required')); return; }

  const products = DB.get('products');
  const idx = products.findIndex(p=>p.id===productId);
  if(idx<0) return;
  products[idx].qty = Number(products[idx].qty)+qty;
  products[idx].purchasePrice = cost || products[idx].purchasePrice;
  products[idx].supplier = supplier || products[idx].supplier;
  products[idx].lastUpdated = nowISO();
  DB.set('products', products);

  const purchases = DB.get('purchases');
  purchases.push({id:uid('pu_'), dateISO:nowISO(), productId, sku:products[idx].sku, qty, costPrice:cost, supplier, notes});
  DB.set('purchases', purchases);
  logStock(productId, products[idx].sku, 'in', qty, products[idx].qty, notes||(SETTINGS.lang==='hi'?'खरीद':'Purchase'), null);

  if(supplier){
    const suppliers = DB.get('suppliers');
    if(!suppliers.find(s=>s.name.toLowerCase()===supplier.toLowerCase())){
      suppliers.push({id:uid('sup_'), name:supplier, phone:'', notes:''});
      DB.set('suppliers', suppliers);
    }
  }
  closeSheet();
  showToast(t('common.success'));
  if(currentScreen==='dashboard') renderDashboard();
}

  const file = fileInput.files[0];
  if(!file){ showToast(t('common.required')); return; }
  if(file.name.toLowerCase().endsWith('.json')){
    processJSONImport(file);
  } else {
    processCSVImport(file);
  }

function processJSONImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const obj = JSON.parse(e.target.result);
      if(!obj.products){ showToast(SETTINGS.lang==='hi'?'अमान्य JSON फ़ाइल':'Invalid JSON file'); return; }
      if(!confirm(SETTINGS.lang==='hi'?'यह मौजूदा सारा डेटा बदल देगा। जारी रखें?':'This will overwrite all current data. Continue?')) return;
      DB.importAll(obj);
      SETTINGS = DB.getSettings();
      closeSheet();
      document.documentElement.setAttribute('data-theme', SETTINGS.theme);
      applyI18n();
      nav('dashboard');
      showToast(SETTINGS.lang==='hi'?'डेटा रीस्टोर हो गया':'Data restored successfully');
    }catch(err){
      showToast(SETTINGS.lang==='hi'?'अमान्य JSON फ़ाइल':'Invalid JSON file');
    }
  };
  reader.readAsText(file);
}
function processCSVImport(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const text = e.target.result;
      const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
      if(lines.length<2){ showToast(SETTINGS.lang==='hi'?'खाली फ़ाइल':'Empty file'); return; }
      const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
      const colIdx = {};
      headers.forEach((h,i)=>colIdx[h.replace(/[^a-z]/g,'')]=i);

      const products = DB.get('products');
      let added=0, restocked=0, skipped=0;
      for(let i=1;i<lines.length;i++){
        const cols = parseCSVLine(lines[i]);
        const get = (key)=> colIdx[key]!==undefined ? (cols[colIdx[key]]||'').trim() : '';
        const name = get('name'), brand = get('brand'), category = get('category')||CATEGORIES[0],
              gender = get('gender')||GENDERS[0], size = get('size'), color = get('color'),
              purchasePrice = parseFloat(get('purchaseprice'))||0, sellingPrice = parseFloat(get('sellingprice'))||0,
              mrp = parseFloat(get('mrp'))||0, qty = parseInt(get('qty'))||0, supplier = get('supplier'),
              rack = get('rack'), box = get('box');
        if(!name || !sellingPrice){ skipped++; continue; }
        const existingIdx = findExistingProductMatch(products, brand||'Generic', name, size||'-', color||'-');
        const sku = existingIdx > -1 ? products[existingIdx].sku : generateNextSKU(products);
        if(existingIdx > -1){
          // Same SKU already in inventory — treat as a restock and add to its
          // quantity rather than discarding these units, instead of silently
          // skipping (which used to lose real stock that the CSV represented).
          products[existingIdx].qty = Number(products[existingIdx].qty) + qty;
          products[existingIdx].lastUpdated = nowISO();
          logStock(products[existingIdx].id, sku, 'in', qty, products[existingIdx].qty, SETTINGS.lang==='hi'?'CSV इम्पोर्ट (रीस्टॉक)':'CSV Import (restock)', null);
          restocked++;
          continue;
        }
        const newP = {id:uid('p_'), sku, barcode:generateBarcodeValue(), name, brand:brand||'Generic', category, gender, season:'All Season',
          size:size||'-', color:color||'-', purchasePrice, sellingPrice, mrp, qty, supplier, rack, box,
          arrivalDate:new Date().toISOString().slice(0,10), lastUpdated:nowISO(), notes:''};
        products.push(newP);
        logStock(newP.id, sku, 'in', qty, qty, SETTINGS.lang==='hi'?'CSV इम्पोर्ट':'CSV Import', null);
        added++;
      }
      DB.set('products', products);
      document.getElementById('csv-import-result').innerHTML = `<div class="card" style="text-align:center;">✅ ${added} ${SETTINGS.lang==='hi'?'नए जोड़े गए':'new added'}, ${restocked} ${SETTINGS.lang==='hi'?'रीस्टॉक हुए':'restocked'}, ${skipped} ${SETTINGS.lang==='hi'?'छोड़े गए':'skipped'}</div>`;
      showToast(t('common.success'));
      if(currentScreen==='inventory') renderInventory();
      if(currentScreen==='dashboard') renderDashboard();
    }catch(err){
      showToast(SETTINGS.lang==='hi'?'फ़ाइल पढ़ने में गलती हुई':'Error reading file');
    }
  };
  reader.readAsText(file);
}
function parseCSVLine(line){
  const result = []; let cur=''; let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQuotes=false; }
      else cur+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ result.push(cur); cur=''; }
      else cur+=c;
    }
  }
  result.push(cur);
  return result;
}

function saveNewPIN(){
  const p1 = document.getElementById('newpin').value.trim();
  const p2 = document.getElementById('newpin2').value.trim();
  if(!/^\d{4}$/.test(p1)){ showToast(SETTINGS.lang==='hi'?'4 अंकों का PIN दर्ज करें':'Enter a 4-digit PIN'); return; }
  if(p1!==p2){ showToast(SETTINGS.lang==='hi'?'PIN मेल नहीं खाता':'PINs do not match'); return; }
  const employees = DB.get('employees');
  if(employees.some(e=>e.pin===p1 && e.active!==false)){ showToast(SETTINGS.lang==='hi'?'यह PIN किसी कर्मचारी के पास पहले से है':'This PIN is already used by an employee'); return; }

  closeSheet();
  showToast(t('common.success'));
}

/* ---------------- BACKUP / RESTORE ---------------- */
function openBackupScreen(){
  const data = DB.exportAll();
  const sizeKB = Math.round(JSON.stringify(data).length/1024);
  openSheet(`
    <div class="sheet-header"><h2>${t('more.backup')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="card">
      <div style="font-weight:700; margin-bottom:4px;">${SETTINGS.lang==='hi'?'मौजूदा डेटा':'Current Data'}</div>
      <div style="font-size:12.5px; color:var(--slate);">
        ${DB.get('products').length} ${SETTINGS.lang==='hi'?'प्रोडक्ट':'products'} ·
        ${DB.get('sales').length} ${SETTINGS.lang==='hi'?'बिक्री':'sales'} ·
        ~${sizeKB} KB
      </div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" style="margin-bottom:10px;" onclick="downloadBackup()">⬇️ ${SETTINGS.lang==='hi'?'JSON बैकअप डाउनलोड करें':'Download JSON Backup'}</button>
    <div class="input-group">
      <label class="input-label">${SETTINGS.lang==='hi'?'बैकअप फ़ाइल से रीस्टोर करें':'Restore from Backup File'}</label>
      <input type="file" accept=".json" id="restore-file" class="input-field" style="padding:10px;">
    </div>
    <button class="btn btn-outline btn-block" onclick="restoreBackup()">⬆️ ${SETTINGS.lang==='hi'?'रीस्टोर करें':'Restore'}</button>
    <p style="font-size:11.5px; color:var(--slate); margin-top:14px; text-align:center;">${SETTINGS.lang==='hi'?'सुझाव: हर हफ्ते बैकअप डाउनलोड करके Google Drive या WhatsApp पर सेव कर लें।':'Tip: download a backup weekly and save it to Google Drive or WhatsApp for safekeeping.'}</p>
  `);
}
function downloadBackup(){
  const data = DB.exportAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `tariq_footwear_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(SETTINGS.lang==='hi'?'बैकअप डाउनलोड हो गया':'Backup downloaded');
}
function restoreBackup(){
  const fileInput = document.getElementById('restore-file');
  const file = fileInput.files[0];
  if(!file){ showToast(t('common.required')); return; }
  if(!confirm(SETTINGS.lang==='hi'?'यह मौजूदा सारा डेटा बदल देगा। जारी रखें?':'This will overwrite all current data. Continue?')) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const obj = JSON.parse(e.target.result);
      DB.importAll(obj);
      SETTINGS = DB.getSettings();
      closeSheet();
      document.documentElement.setAttribute('data-theme', SETTINGS.theme);
      applyI18n();
      nav('dashboard');
      showToast(SETTINGS.lang==='hi'?'डेटा रीस्टोर हो गया':'Data restored successfully');
    }catch(err){
      showToast(SETTINGS.lang==='hi'?'अमान्य बैकअप फ़ाइल':'Invalid backup file');
    }
  };
  reader.readAsText(file);
}

/* daily auto-backup reminder (local, non-intrusive) */
function checkBackupReminder(){
  const last = localStorage.getItem('tf_last_backup_nudge');
  const daysSince = last ? Math.floor((Date.now()-Number(last))/86400000) : 999;
  if(daysSince>=7 && DB.get('products').length>0){
    setTimeout(()=>{
      showToast(SETTINGS.lang==='hi'?'💾 याद दिलाना: इस हफ्ते अपना बैकअप ले लें (सेटिंग्स में)':'💾 Reminder: take a backup this week (in Settings)', 4000);
      localStorage.setItem('tf_last_backup_nudge', String(Date.now()));
    }, 1500);
  }
}
