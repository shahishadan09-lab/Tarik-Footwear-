/* ---------------- RETURNS / EXCHANGE ---------------- */
function openReturnForSale(saleId){
  const sale = DB.get('sales').find(s=>s.id===saleId);
  if(!sale) return;
  const existingReturns = DB.get('returns').filter(r=>r.saleId===saleId);
  const alreadyReturnedByProduct = {};
  existingReturns.forEach(r=>{ alreadyReturnedByProduct[r.productId] = (alreadyReturnedByProduct[r.productId]||0) + Number(r.qty); });

  openSheet(`
    <div class="sheet-header"><h2>${t('sale.return')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div style="font-size:12.5px; color:var(--slate); margin-bottom:10px;">Bill #${esc(sale.billNo)}</div>
    ${sale.items.map((it,i)=>{
      const alreadyReturned = alreadyReturnedByProduct[it.productId]||0;
      const maxReturnable = Math.max(0, it.qty - alreadyReturned);
      return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div style="flex:1;">
          <div style="font-weight:600; font-size:13px;">${esc(it.name)}</div>
          <div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'खरीदी गई मात्रा':'Bought qty'}: ${it.qty}${alreadyReturned>0?` · ${SETTINGS.lang==='hi'?'पहले से वापस':'already returned'}: ${alreadyReturned}`:''}</div>
        </div>
        <input class="input-field" style="width:60px; text-align:center;" type="number" min="0" max="${maxReturnable}" value="0" data-max="${maxReturnable}" id="ret-qty-${i}">
      </div>
    `}).join('')}
    <div class="input-group" style="margin-top:10px;"><label class="input-label">${SETTINGS.lang==='hi'?'कारण':'Reason'}</label>
      <input class="input-field" id="ret-reason" placeholder="${SETTINGS.lang==='hi'?'जैसे: साइज़ ठीक नहीं':'e.g. wrong size'}"></div>
    <button class="btn btn-danger btn-block btn-lg" onclick="processReturn('${sale.id}')">${t('sale.return')}</button>
  `);
}
function processReturn(saleId){
  const sale = DB.get('sales').find(s=>s.id===saleId);
  if(!sale) return;
  const reason = document.getElementById('ret-reason').value.trim();
  let refundTotal = 0;
  const returns = DB.get('returns');
  const products = DB.get('products');
  let exceeded = false;

  sale.items.forEach((it,i)=>{
    const input = document.getElementById('ret-qty-'+i);
    const qty = parseInt(input.value)||0;
    if(qty<=0) return;
    const maxReturnable = parseInt(input.dataset.max)||0;
    if(qty > maxReturnable){ exceeded = true; return; }
    refundTotal += qty*it.price;
    returns.push({id:uid('rt_'), dateISO:nowISO(), saleId:sale.id, productId:it.productId, sku:it.sku, qty, refundAmount:qty*it.price, reason});
    const idx = products.findIndex(p=>p.id===it.productId);
    if(idx>-1){
      products[idx].qty = Number(products[idx].qty)+qty;
      products[idx].lastUpdated = nowISO();
      logStock(it.productId, it.sku, 'return', qty, products[idx].qty, 'Return: Bill #'+sale.billNo, sale.id);
    }
  });
  if(exceeded){ showToast(SETTINGS.lang==='hi'?'वापसी की मात्रा खरीदी गई मात्रा से ज़्यादा नहीं हो सकती':'Return quantity cannot exceed what was bought'); return; }
  if(refundTotal===0){ showToast(t('common.required')); return; }
  DB.set('returns', returns);
  DB.set('products', products);
  closeSheet();
  showToast((SETTINGS.lang==='hi'?'वापसी पूरी हुई। रिफंड: ':'Return processed. Refund: ')+money(refundTotal));
  if(currentScreen==='dashboard') renderDashboard();
}

        <div class="card" style="display:flex; justify-content:space-between;">

          <div style="font-size:11.5px; color:var(--slate);">${fmtDateTime(r.dateISO)}${r.reason?' · '+esc(r.reason):''}</div></div>
          <div style="font-weight:700; color:var(--terracotta);">-${money(r.refundAmount)}</div>
        </div>
      `).join('')
    }
  `);
}

/* =========================================================================
   REPORTS MODULE — expanded report set for ladies+men's footwear retail
   ========================================================================= */
function getReportList(){
  const base = [
    {key:'daily', icon:'📅'}, {key:'weekly', icon:'📆'}, {key:'monthly', icon:'🗓️'}, {key:'yearly', icon:'📈'},
    {key:'profit', icon:'💰'}, {key:'loss', icon:'📉'}, {key:'stock', icon:'📦'}, {key:'valuation', icon:'💎'},
    {key:'lowStock', icon:'🔶'}, {key:'outStock', icon:'⛔'}, {key:'fastMoving', icon:'🚀'}, {key:'slowMoving', icon:'🐢'},
    {key:'deadStock', icon:'💀'}, {key:'topProducts', icon:'⭐'}, {key:'topSizes', icon:'📏'}, {key:'topColors', icon:'🎨'},
    {key:'brandWise', icon:'🏷️'}, {key:'categoryWise', icon:'👡'}, {key:'sizeWise', icon:'📐'}, {key:'colorWise', icon:'🖌️'},
    {key:'paymentMethod', icon:'💳'}, {key:'purchase', icon:'🛒'}
  ];
  if(CURRENT_USER && CURRENT_USER.role === 'owner'){
    base.push({key:'employeeSales', icon:'👤'});
    base.push({key:'shopWise', icon:'🏪'});
  }
  return base;
}

function renderReports(){
  const screen = document.getElementById('screen-reports');
  const list = getReportList();
  screen.innerHTML = `
    <div id="report-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      ${list.map(r=>`
        <button class="qa-btn" style="align-items:flex-start; text-align:left;" onclick="showReport('${r.key}')">
          <span class="qa-icon">${r.icon}</span>
          <span style="font-size:12.5px; line-height:1.3;">${t('reports.'+r.key)}</span>
        </button>
      `).join('')}
    </div>
  `;
}

function salesInRange(start, end){
  return DB.get('sales').filter(s=>{
    const d = new Date(s.dateISO);
    return d>=start && d<=end;
  });
}

function showReport(key){
  const products = DB.get('products');
  const now = new Date();
  let title = t('reports.'+key);
  let bodyHtml = '';
  let exportRows = null;

  if(key==='daily' || key==='weekly' || key==='monthly' || key==='yearly'){
    let start;
    if(key==='daily'){ start = new Date(); start.setHours(0,0,0,0); }
    else if(key==='weekly'){ start = startOfWeek(); }
    else if(key==='monthly'){ start = startOfMonth(); }
    else { start = startOfYear(); }
    const sales = salesInRange(start, now).sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO));
    const total = sales.reduce((s,x)=>s+Number(x.total),0);
    const count = sales.length;
    bodyHtml = `
      <div class="row" style="margin-bottom:14px;">
        <div class="stat-card accent-green"><div class="stat-label">${SETTINGS.lang==='hi'?'कुल बिक्री':'Total Sales'}</div><div class="stat-value">${money(total)}</div></div>
        <div class="stat-card"><div class="stat-label">${SETTINGS.lang==='hi'?'कुल बिल':'Total Bills'}</div><div class="stat-value">${count}</div></div>
      </div>
      ${sales.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
        sales.map(s=>`<div class="card" style="display:flex; justify-content:space-between;"><div><b>#${esc(s.billNo)}</b><div style="font-size:11.5px; color:var(--slate);">${fmtDateTime(s.dateISO)}</div></div><div style="font-weight:700;">${money(s.total)}</div></div>`).join('')
      }`;
    exportRows = [['Bill No','Date','Items','Total','Payment'], ...sales.map(s=>[s.billNo, fmtDateTime(s.dateISO), s.items.length, s.total, paymentModeLabel(s.paymentMode)])];
  }

  else if(key==='profit' || key==='loss'){
    const ranges = [
      {label: SETTINGS.lang==='hi'?'आज':'Today', start: (()=>{const d=new Date(); d.setHours(0,0,0,0); return d;})()},
      {label: t('dash.week'), start: rollingWeekStart()},
      {label: t('dash.month'), start: rollingMonthStart()},
      {label: t('dash.year'), start: startOfYear()}
    ];
    if(key==='profit'){
      bodyHtml = ranges.map(r=>{
        const sales = salesInRange(r.start, now);
        let revenue=0, cost=0;
        sales.forEach(s=> (s.items||[]).forEach(it=>{ revenue += it.qty*it.price; cost += it.qty*Number(it.cost||0); }));
        const profit = revenue-cost;
        const margin = revenue>0 ? ((profit/revenue)*100).toFixed(1) : '0';
        return `<div class="card">
          <div class="eyebrow">${r.label}</div>
          <div style="display:flex; justify-content:space-between; margin-top:6px;">
            <div><div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'आय':'Revenue'}</div><div style="font-weight:700;">${money(revenue)}</div></div>
            <div><div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'लागत':'Cost'}</div><div style="font-weight:700;">${money(cost)}</div></div>
            <div><div style="font-size:11.5px; color:var(--slate);">${t('dash.profit')}</div><div style="font-weight:800; color:#3d7a52;">${money(profit)} (${margin}%)</div></div>
          </div>
        </div>`;
      }).join('');
    } else {
      // Loss report: damage stock loss + return refunds, by period
      const damage = DB.get('damageStock');
      const returns = DB.get('returns');
      bodyHtml = ranges.map(r=>{
        const damageInRange = damage.filter(d=>new Date(d.dateISO)>=r.start);
        const returnsInRange = returns.filter(rt=>new Date(rt.dateISO)>=r.start);
        const damageLoss = damageInRange.reduce((s,d)=>s+Number(d.lostValue||0),0);
        const returnLoss = returnsInRange.reduce((s,rt)=>s+Number(rt.refundAmount||0),0);
        return `<div class="card">
          <div class="eyebrow">${r.label}</div>
          <div style="display:flex; justify-content:space-between; margin-top:6px;">
            <div><div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'डैमेज नुकसान':'Damage Loss'}</div><div style="font-weight:700; color:var(--terracotta);">${money(damageLoss)}</div></div>
            <div><div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'रिफंड':'Returns Refunded'}</div><div style="font-weight:700; color:var(--terracotta);">${money(returnLoss)}</div></div>
            <div><div style="font-size:11.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल':'Total'}</div><div style="font-weight:800; color:#a33;">${money(damageLoss+returnLoss)}</div></div>
          </div>
        </div>`;
      }).join('');
    }
  }

  else if(key==='stock'){
    const sorted = products.slice().sort((a,b)=>(a.brand+a.name).localeCompare(b.brand+b.name));
    bodyHtml = sorted.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:`
      <table class="report-table"><thead><tr><th>${t('product.name')}</th><th>${SETTINGS.lang==='hi'?'साइज़':'Size'}</th><th>${t('inv.qty')}</th><th>${t('inv.price')}</th></tr></thead>
      <tbody>${sorted.map(p=>`<tr><td>${esc(p.brand)} ${esc(p.name)}<br><span style="color:var(--slate); font-size:11px;">${esc(p.color)}</span></td><td>${esc(p.size)}</td><td class="${qtyClass(p.qty)}">${p.qty}</td><td>${money(p.sellingPrice)}</td></tr>`).join('')}</tbody></table>`;
    exportRows = [['Brand','Name','Category','Gender','Size','Color','SKU','Qty','Purchase Price','Selling Price','MRP'],
      ...sorted.map(p=>[p.brand,p.name,p.category,p.gender,p.size,p.color,p.sku,p.qty,p.purchasePrice,p.sellingPrice,p.mrp])];
  }

  else if(key==='valuation'){
    const totalCost = products.reduce((s,p)=>s+Number(p.qty)*Number(p.purchasePrice),0);
    const totalRetail = products.reduce((s,p)=>s+Number(p.qty)*Number(p.sellingPrice),0);
    const byCategory = {};
    products.forEach(p=>{ byCategory[p.category] = (byCategory[p.category]||0) + Number(p.qty)*Number(p.purchasePrice); });
    bodyHtml = `
      <div class="row" style="margin-bottom:14px;">
        <div class="stat-card accent-peach"><div class="stat-label">${SETTINGS.lang==='hi'?'खरीद मूल्य पर':'At Cost Price'}</div><div class="stat-value">${money(totalCost)}</div></div>
        <div class="stat-card accent-green"><div class="stat-label">${SETTINGS.lang==='hi'?'बिक्री मूल्य पर':'At Retail Price'}</div><div class="stat-value">${money(totalRetail)}</div></div>
      </div>
      <div class="section-title"><h3>${SETTINGS.lang==='hi'?'श्रेणी अनुसार':'By Category'}</h3></div>
      ${Object.entries(byCategory).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="card" style="display:flex; justify-content:space-between;"><span>${categoryLabel(c)}</span><b>${money(v)}</b></div>`).join('')}
    `;
  }

  else if(key==='lowStock' || key==='outStock'){
    const threshold = Number(SETTINGS.lowStockThreshold||3);
    const list = key==='lowStock'
      ? products.filter(p=>Number(p.qty)>0 && Number(p.qty)<=threshold)
      : products.filter(p=>Number(p.qty)<=0);
    bodyHtml = list.length===0?`<div class="empty-state">${SETTINGS.lang==='hi'?'कुछ नहीं':'Nothing here'} 🎉</div>`:
      list.map(p=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="closeSheet(); openProductDetail('${p.id}')">
        <div><b>${esc(p.brand)} ${esc(p.name)}</b><div style="font-size:11.5px; color:var(--slate);">${esc(p.color)} · ${SETTINGS.lang==='hi'?'साइज़':'Size'} ${esc(p.size)}</div></div>
        <div class="badge ${key==='outStock'?'badge-terracotta':'badge-peach'}">${qtyLabel(p.qty)}</div></div>`).join('');
    exportRows = [['Brand','Name','Size','Color','Qty','SKU'], ...list.map(p=>[p.brand,p.name,p.size,p.color,p.qty,p.sku])];
  }

  else if(key==='fastMoving' || key==='slowMoving'){
    const since = new Date(); since.setDate(since.getDate()-30);
    const sales30 = salesInRange(since, now);
    const soldQty = {};
    sales30.forEach(s=>(s.items||[]).forEach(it=>{ soldQty[it.productId]=(soldQty[it.productId]||0)+it.qty; }));
    let ranked = products.map(p=>({p, sold:soldQty[p.id]||0}));
    ranked = key==='fastMoving' ? ranked.filter(r=>r.sold>0).sort((a,b)=>b.sold-a.sold).slice(0,25)
                                  : ranked.filter(r=>r.sold===0 && Number(r.p.qty)>0).slice(0,25);
    bodyHtml = ranked.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
      ranked.map(r=>`<div class="card" style="display:flex; justify-content:space-between;"><div><b>${esc(r.p.brand)} ${esc(r.p.name)}</b><div style="font-size:11.5px; color:var(--slate);">${esc(r.p.color)} · ${SETTINGS.lang==='hi'?'साइज़':'Size'} ${esc(r.p.size)}</div></div><div style="font-weight:700;">${SETTINGS.lang==='hi'?'30 दिन में बिके':'sold in 30d'}: ${r.sold}</div></div>`).join('');
  }

  else if(key==='deadStock'){
    const days = Number(SETTINGS.deadStockDays||90);
    const logs = DB.get('stockLog');
    const list = products.filter(p=>{
      if(Number(p.qty)<=0) return false;
      const lastSale = logs.filter(l=>l.productId===p.id && l.type==='sale').sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO))[0];
      const refDate = lastSale ? lastSale.dateISO : p.arrivalDate;
      p._deadStockRefDate = refDate; // stash for display below so the badge matches the filter logic exactly
      return daysAgo(refDate) >= days;
    });
    bodyHtml = list.length===0?`<div class="empty-state">${SETTINGS.lang==='hi'?'कोई डेड स्टॉक नहीं':'No dead stock'} 🎉</div>`:
      list.map(p=>`<div class="card" style="display:flex; justify-content:space-between;"><div><b>${esc(p.brand)} ${esc(p.name)}</b><div style="font-size:11.5px; color:var(--slate);">${esc(p.color)} · ${SETTINGS.lang==='hi'?'साइज़':'Size'} ${esc(p.size)} · ${qtyLabel(p.qty)}</div></div><div class="badge badge-terracotta">${daysAgo(p._deadStockRefDate)}d</div></div>`).join('');
    exportRows = [['Brand','Name','Size','Color','Qty','Days Since Last Sale (or Arrival)'], ...list.map(p=>[p.brand,p.name,p.size,p.color,p.qty,daysAgo(p._deadStockRefDate)])];
  }

  else if(key==='topProducts' || key==='topSizes' || key==='topColors' || key==='brandWise' || key==='categoryWise' || key==='sizeWise' || key==='colorWise'){
    const fieldMap = {topSizes:'size', topColors:'color', brandWise:'brand', categoryWise:'category', sizeWise:'size', colorWise:'color'};
    const sales = DB.get('sales');
    const grouped = {};
    sales.forEach(s=>(s.items||[]).forEach(it=>{
      const prod = products.find(p=>p.id===it.productId);
      let groupKey;
      if(key==='topProducts'){
        groupKey = prod ? `${prod.brand} ${prod.name}` : (it.name || 'Unknown');
      } else {
        const field = fieldMap[key];
        groupKey = prod ? (field==='category'?categoryLabel(prod[field]):prod[field]) : 'Unknown';
      }
      if(!grouped[groupKey]) grouped[groupKey] = {qty:0, revenue:0};
      grouped[groupKey].qty += it.qty;
      grouped[groupKey].revenue += it.qty*it.price;
    }));
    let rows = Object.entries(grouped).sort((a,b)=>b[1].revenue-a[1].revenue);
    if(key.startsWith('top')) rows = rows.slice(0,20);
    const labelCol = key==='topProducts' ? (SETTINGS.lang==='hi'?'प्रोडक्ट':'Product') : (fieldMap[key] || 'Group');
    bodyHtml = rows.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
      `<table class="report-table"><thead><tr><th>${labelCol}</th><th>${SETTINGS.lang==='hi'?'मात्रा':'Qty Sold'}</th><th>${SETTINGS.lang==='hi'?'आय':'Revenue'}</th></tr></thead>
      <tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.qty}</td><td>${money(v.revenue)}</td></tr>`).join('')}</tbody></table>`;
    exportRows = [[labelCol,'Qty Sold','Revenue'], ...rows.map(([k,v])=>[k,v.qty,v.revenue])];
  }

  else if(key==='paymentMethod'){
    const sales = DB.get('sales');
    const grouped = {};
    sales.forEach(s=>{
      const mode = s.paymentMode || 'cash';
      if(!grouped[mode]) grouped[mode] = {count:0, total:0};
      grouped[mode].count++;
      grouped[mode].total += Number(s.total||0);
    });
    const rows = Object.entries(grouped).sort((a,b)=>b[1].total-a[1].total);
    bodyHtml = rows.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
      rows.map(([mode,v])=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>${paymentModeIcon(mode)} <b>${paymentModeLabel(mode)}</b><div style="font-size:11.5px; color:var(--slate);">${v.count} ${SETTINGS.lang==='hi'?'बिल':'bills'}</div></div>
        <div style="font-weight:700;">${money(v.total)}</div>
      </div>`).join('');
    exportRows = [['Payment Mode','Bills','Total'], ...rows.map(([mode,v])=>[paymentModeLabel(mode),v.count,v.total])];
  }

  else if(key==='purchase'){
    const purchases = DB.get('purchases').slice().sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO));
    const totalQty = purchases.reduce((s,p)=>s+Number(p.qty||0),0);
    const totalCost = purchases.reduce((s,p)=>s+Number(p.qty||0)*Number(p.costPrice||0),0);
    bodyHtml = `
      <div class="row" style="margin-bottom:14px;">
        <div class="stat-card"><div class="stat-label">${SETTINGS.lang==='hi'?'कुल खरीदी गई मात्रा':'Total Qty Purchased'}</div><div class="stat-value">${totalQty}</div></div>
        <div class="stat-card accent-peach"><div class="stat-label">${SETTINGS.lang==='hi'?'कुल खरीद लागत':'Total Purchase Cost'}</div><div class="stat-value">${money(totalCost)}</div></div>
      </div>
      ${purchases.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
        purchases.slice(0,100).map(p=>`<div class="card" style="display:flex; justify-content:space-between;"><div><b>${esc(p.sku)}</b><div style="font-size:11.5px; color:var(--slate);">${fmtDateTime(p.dateISO)}${p.supplier?' · '+esc(p.supplier):''}</div></div><div style="text-align:right;"><div style="font-weight:700;">+${p.qty}</div><div style="font-size:11px; color:var(--slate);">${money(p.qty*p.costPrice)}</div></div></div>`).join('')
      }`;
    exportRows = [['Date','SKU','Qty','Cost Price','Supplier'], ...purchases.map(p=>[fmtDateTime(p.dateISO),p.sku,p.qty,p.costPrice,p.supplier])];
  }

  else if(key==='employeeSales'){
    const sales = DB.get('sales');
    const employees = DB.get('employees');
    const grouped = {};
    sales.forEach(s=>{
      const empId = s.employeeId || 'owner';
      const empName = s.employeeName || (SETTINGS.lang==='hi'?'मालिक':'Owner');
      if(!grouped[empId]) grouped[empId] = {name:empName, count:0, total:0};
      grouped[empId].count++;
      grouped[empId].total += Number(s.total||0);
    });
    const rows = Object.values(grouped).sort((a,b)=>b.total-a.total);
    bodyHtml = rows.length===0?`<div class="empty-state">${t('reports.noData')}</div>`:
      rows.map(v=>`<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
        <div>👤 <b>${esc(v.name)}</b><div style="font-size:11.5px; color:var(--slate);">${v.count} ${SETTINGS.lang==='hi'?'बिल':'bills'}</div></div>
        <div style="font-weight:700;">${money(v.total)}</div>
      </div>`).join('');
    exportRows = [['Employee','Bills','Total Sales'], ...rows.map(v=>[v.name,v.count,v.total])];
  }

  else if(key==='shopWise'){
    const sales = DB.get('sales');
    const shop1Sales = sales.filter(s=>(s.shopId||'shop1')==='shop1');
    const shop2Sales = sales.filter(s=>s.shopId==='shop2');
    const shopTotal1 = shop1Sales.reduce((s,x)=>s+Number(x.total||0),0);
    const shopTotal2 = shop2Sales.reduce((s,x)=>s+Number(x.total||0),0);
    bodyHtml = `
      <div class="card">
        <div class="eyebrow">🏪 ${SETTINGS.lang==='hi'?'दुकान 1':'Shop 1'}</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <div><div style="font-size:12px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल बिल':'Total Bills'}</div><div style="font-weight:700; font-size:18px;">${shop1Sales.length}</div></div>
          <div><div style="font-size:12px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल बिक्री':'Total Sales'}</div><div style="font-weight:800; font-size:18px; color:#3d7a52;">${money(shopTotal1)}</div></div>
        </div>
      </div>
      <div class="card">
        <div class="eyebrow">🏬 ${SETTINGS.lang==='hi'?'दुकान 2':'Shop 2'}</div>
        <div style="display:flex; justify-content:space-between; margin-top:8px;">
          <div><div style="font-size:12px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल बिल':'Total Bills'}</div><div style="font-weight:700; font-size:18px;">${shop2Sales.length}</div></div>
          <div><div style="font-size:12px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल बिक्री':'Total Sales'}</div><div style="font-weight:800; font-size:18px; color:#3d7a52;">${money(shopTotal2)}</div></div>
        </div>
      </div>
      <div class="card accent-green" style="background:var(--green);">
        <div class="eyebrow">${SETTINGS.lang==='hi'?'दोनों दुकान मिलाकर':'Combined Both Shops'}</div>
        <div style="font-weight:800; font-size:22px; margin-top:6px;">${money(shopTotal1+shopTotal2)}</div>
      </div>`;
    exportRows = [['Shop','Bills','Total'],['Shop 1',shop1Sales.length,shopTotal1],['Shop 2',shop2Sales.length,shopTotal2]];
  }

  openSheet(`
    <div class="sheet-header"><h2>${title}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    ${exportRows ? `<button class="btn btn-outline btn-block" style="margin-bottom:14px;" onclick='exportReportCSV(${JSON.stringify(title)}, ${JSON.stringify(exportRows)})'>⬇️ ${t('reports.export')}</button>` : ''}
    ${bodyHtml}
  `);
}

function exportReportCSV(title, rows){
  downloadCSV(title.replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.csv', rows);
  showToast(SETTINGS.lang==='hi'?'CSV डाउनलोड हो गई':'CSV downloaded');
}

/* =========================================================================
   CUSTOMER MANAGEMENT
   ========================================================================= */
function openCreditReport(){
  const customers = DB.get('customers').filter(c=>Number(c.outstandingBalance||0) > 0).sort((a,b)=>Number(b.outstandingBalance||0)-Number(a.outstandingBalance||0));
  const totalDue = customers.reduce((sum,c)=>sum+Number(c.outstandingBalance||0),0);
  openSheet(`
    <div class="sheet-header"><h2>${t('more.creditReport')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="card" style="text-align:center; background:rgba(224,87,74,0.1); border-color:var(--terracotta); margin-bottom:16px;">

function openExpensesScreen(){
  window._expensesFilter = window._expensesFilter || 'month';
  const expenses = DB.get('expenses').slice().sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO));
  renderExpensesSheet(expenses);
}
function renderExpensesSheet(expenses){
  const filter = window._expensesFilter || 'month';
  const now = new Date();
  let start;
  if(filter==='today'){ start = new Date(now); start.setHours(0,0,0,0); }
  else if(filter==='week'){ start = rollingWeekStart(); }
  else if(filter==='month'){ start = rollingMonthStart(); }
  else { start = new Date(0); } // 'all'
  const filtered = expenses.filter(e=>new Date(e.dateISO) >= start);
  const total = filtered.reduce((sum,e)=>sum+Number(e.amount||0),0);

  const filterBtn = (key,label) => `<button class="tab-pill ${filter===key?'active':''}" onclick="window._expensesFilter='${key}'; renderExpensesSheet(DB.get('expenses'))">${label}</button>`;

  openSheet(`
    <div class="sheet-header"><h2>${t('more.expenses')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
      ${filterBtn('today', SETTINGS.lang==='hi'?'आज':'Today')}
      ${filterBtn('week', t('dash.week'))}
      ${filterBtn('month', t('dash.month'))}
      ${filterBtn('all', SETTINGS.lang==='hi'?'सभी':'All')}
    </div>
    <div class="card" style="text-align:center; margin-bottom:16px;">
      <div style="font-size:12.5px; color:var(--slate);">${SETTINGS.lang==='hi'?'कुल खर्च':'Total Expenses'}</div>
      <div style="font-size:28px; font-weight:800; color:var(--terracotta); font-family:var(--font-display); margin-top:4px;">${money(total)}</div>
    </div>
    <button class="btn btn-primary btn-block" style="margin-bottom:14px;" onclick="openAddExpenseForm()">➕ ${t('expense.add')}</button>
    ${filtered.length===0 ? `<div class="empty-state">${SETTINGS.lang==='hi'?'इस अवधि में कोई खर्च नहीं':'No expenses in this period'}</div>` :
      filtered.map(e=>`
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <div style="font-weight:700; font-size:14px;">${expenseCategoryLabel(e.category)}</div>
              ${e.notes?`<div style="font-size:12.5px; color:var(--slate); margin-top:2px;">${esc(e.notes)}</div>`:''}
              <div style="font-size:11.5px; color:var(--slate); margin-top:4px;">${fmtDateTime(e.dateISO)}${e.addedBy?' · '+esc(e.addedBy):''}</div>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
              <div style="font-weight:800; color:var(--terracotta); font-family:var(--font-display);">${money(e.amount)}</div>
              <button class="icon-btn" style="width:28px; height:28px;" onclick="confirmDeleteExpense('${e.id}')">🗑️</button>
            </div>
          </div>
        </div>
      `).join('')
    }
  `);
}
function openAddExpenseForm(){
  const catOptions = EXPENSE_CATEGORIES.map(c=>`<option value="${c}">${expenseCategoryLabel(c)}</option>`).join('');
  openSheet(`
    <div class="sheet-header"><h2>${t('expense.add')}</h2><button class="icon-btn" onclick="openExpensesScreen()">✕</button></div>
    <form onsubmit="return submitExpenseForm(event)">

        <input class="input-field" id="exp-amount" type="number" min="0" step="0.01" required placeholder="0"></div>
      <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'कारण':'Reason'} *</label>
        <select class="input-field" id="exp-category">${catOptions}</select></div>

        <input class="input-field" id="exp-notes" placeholder="${SETTINGS.lang==='hi'?'जैसे: राज सप्लायर, जनवरी सैलरी':'e.g. Raj Supplier, January salary'}"></div>
      <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'तारीख':'Date'}</label>
        <input class="input-field" id="exp-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">${t('product.save')}</button>

function submitExpenseForm(ev){
  ev.preventDefault();
  const amount = parseFloat(document.getElementById('exp-amount').value);
  const category = document.getElementById('exp-category').value;
  const notes = document.getElementById('exp-notes').value.trim();
  const dateVal = document.getElementById('exp-date').value;
  if(!amount || amount<=0){ showToast(SETTINGS.lang==='hi'?'सही राशि डालें':'Enter a valid amount'); return false; }
  const expenses = DB.get('expenses');
  expenses.push({
    id: uid('exp_'),
    amount, category, notes,
    dateISO: dateVal ? new Date(dateVal+'T12:00:00').toISOString() : nowISO(),
    addedBy: CURRENT_USER ? CURRENT_USER.name : '',
    shopId: _selectedShopId || 'shop1'
  });
  DB.set('expenses', expenses);
  showToast(t('common.success'));
  openExpensesScreen();
  return false;
}
function confirmDeleteExpense(id){
  if(!confirm(SETTINGS.lang==='hi'?'ये खर्च मिटाना है?':'Delete this expense?')) return;
  const expenses = DB.get('expenses').filter(e=>e.id!==id);
  DB.set('expenses', expenses);
  openExpensesScreen();
}

/* ===== employees.js ===== */
/* =========================================================================
   EMPLOYEE MANAGEMENT
   Roles: owner (full access, not stored as an employee record — uses the
   main Settings PIN), manager (inventory+sales+reports), sales (sales only).
   Each employee has their own 4-digit PIN, checked at login alongside the
   owner PIN in app.js's pinPress().
   ========================================================================= */
const EMPLOYEE_ROLES = ['manager','sales'];
function roleLabel(role){
  const map = {
    hi:{owner:'मालिक', manager:'मैनेजर', sales:'सेल्स स्टाफ'},
    en:{owner:'Owner', manager:'Manager', sales:'Sales Staff'}
  };
  return (map[SETTINGS.lang]||map.en)[role] || role;
}

function openEmployeesScreen(){
  if(CURRENT_USER && CURRENT_USER.role !== 'owner'){
    showToast(SETTINGS.lang==='hi'?'केवल मालिक एक्सेस कर सकता है':'Only the owner can access this');
    return;
  }
  const employees = DB.get('employees').slice().sort((a,b)=>a.name.localeCompare(b.name));
  openSheet(`
    <div class="sheet-header"><h2>${t('more.employees')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <button class="btn btn-outline btn-block" style="margin-bottom:14px;" onclick="openAddEmployee()">➕ ${SETTINGS.lang==='hi'?'नया कर्मचारी':'Add Employee'}</button>
    ${employees.length===0?`<div class="empty-state">—</div>`:
      employees.map(e=>employeeRowHTML(e)).join('')
    }
  `);
}
function employeeRowHTML(e){
  return `<div class="card" style="cursor:pointer;" onclick="openEmployeeDetail('${e.id}')">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div><b>${esc(e.name)}</b><div style="font-size:12px; color:var(--slate);">${roleLabel(e.role)} · ${esc(e.mobile)||'—'}</div></div>
      <div class="badge ${e.active!==false?'badge-green':'badge-gray'}">${e.active!==false?(SETTINGS.lang==='hi'?'सक्रिय':'Active'):(SETTINGS.lang==='hi'?'निष्क्रिय':'Inactive')}</div>
    </div>
  </div>`;
}
function openAddEmployee(){
  const roleOptions = EMPLOYEE_ROLES.map(r=>`<option value="${r}">${roleLabel(r)}</option>`).join('');
  openSheet(`
    <div class="sheet-header"><h2>${SETTINGS.lang==='hi'?'नया कर्मचारी':'Add Employee'}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'नाम':'Name'} *</label><input class="input-field" id="emp-name"></div>
    <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'मोबाइल':'Mobile'}</label><input class="input-field" id="emp-mobile" type="tel"></div>
    <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'रोल':'Role'} *</label><select class="input-field" id="emp-role">${roleOptions}</select></div>
    <div class="input-group"><label class="input-label">${SETTINGS.lang==='hi'?'4-अंक PIN (लॉगिन के लिए)':'4-digit PIN (for login)'} *</label>
      <input class="input-field" id="emp-pin" type="tel" maxlength="4" inputmode="numeric" placeholder="1234"></div>
    <p style="font-size:11.5px; color:var(--slate); margin-top:-6px; margin-bottom:14px;">${SETTINGS.lang==='hi'?'यह PIN मालिक के PIN से अलग होना चाहिए':'This PIN must be different from the owner PIN'}</p>
    <button class="btn btn-primary btn-block btn-lg" onclick="saveEmployee()">${t('common.save')}</button>
  `);
}
function saveEmployee(){
  const name = document.getElementById('emp-name').value.trim();
  const mobile = document.getElementById('emp-mobile').value.trim();
  const role = document.getElementById('emp-role').value;
  const pin = document.getElementById('emp-pin').value.trim();

  if(!name || !/^\d{4}$/.test(pin)){ showToast(t('common.required')); return; }
  if(pin === SETTINGS.pin){ showToast(SETTINGS.lang==='hi'?'यह PIN मालिक के PIN जैसा है, अलग चुनें':'This PIN matches the owner PIN, choose another'); return; }
  const employees = DB.get('employees');
  if(employees.some(e=>e.pin===pin && e.active!==false)){ showToast(SETTINGS.lang==='hi'?'यह PIN पहले से उपयोग में है':'This PIN is already in use'); return; }

  employees.push({id:uid('emp_'), name, mobile, role, pin, active:true, createdAt:nowISO()});
  DB.set('employees', employees);
  closeSheet();
  showToast(t('common.success'));
  openEmployeesScreen();
}

      <div class="row">

    ${loginLog.length===0?`<div class="empty-state">—</div>`:

    }
  `);

function toggleEmployeeActive(id){
  const employees = DB.get('employees');
  const idx = employees.findIndex(e=>e.id===id);

  employees[idx].active = employees[idx].active===false ? true : false;
  DB.set('employees', employees);
  closeSheet();
  showToast(t('common.success'));
  openEmployeesScreen();
}
function confirmDeleteEmployee(id){

function handleBillImageSelected(file){
  if(!file) return;
  const statusEl = document.getElementById('bill-scan-status');
  statusEl.innerHTML = `
    <div class="card" style="text-align:center; padding:28px 16px;">
      <div style="font-size:32px; margin-bottom:8px;">🖼️</div>
      <div style="font-weight:600;">${SETTINGS.lang==='hi'?'फ़ोटो तैयार की जा रही है...':'Preparing photo...'}</div>
    </div>
  `;

  // Phone cameras often produce very large images (4000x3000px, several MB).
  // The previous approach (new Image() + canvas) still forced the browser to
  // fully decode the image at FULL resolution into memory first (a 4000x3000
  // photo decodes to ~48MB of raw pixel data) before any resizing happened —
  // that decode step itself was what crashed low-RAM phones with "low memory",
  // even though the final output was already being shrunk.
  //
  // createImageBitmap() with resizeWidth/resizeHeight lets Chrome downscale
  // DURING decode instead of after, so the large intermediate bitmap is never
  // fully materialized. This is the actual fix for the memory crash; the
  // previous canvas step only fixed the output size, not the decode cost.
  resizeImageMemoryEfficient(file, 1024)
    .then((blob)=>{
      if(!blob){
        statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'फ़ोटो तैयार नहीं हो पाई, दोबारा कोशिश करें':'Could not prepare photo, try again'}</div>`;
        return;
      }
      processBillBlob(blob, statusEl);
    })
    .catch((err)=>{
      statusEl.innerHTML = `<div class="empty-state">⚠️ ${SETTINGS.lang==='hi'?'फ़ोटो प्रोसेस नहीं हो पाई — फ़ोन की मेमोरी कम है, ऐप के दूसरे टैब बंद करके दोबारा कोशिश करें':'Could not process photo — phone memory is low, close other tabs and try again'}</div>`;
    });
}

async function resizeImageMemoryEfficient(file, maxDim){
  let bitmap;
  if(typeof createImageBitmap === 'function'){
    try{
      // Read just the dimensions cheaply via a lightweight <img> + naturalWidth/
      // naturalHeight check (this does NOT materialize full decoded pixel data
      // the way createImageBitmap() without resize options would — it only
      // needs the image header to know its size). Only then do we call
      // createImageBitmap with resize options already attached, so Chrome
      // downscales DURING decode and never holds the full-resolution bitmap.
      const dims = await new Promise((resolve, reject)=>{
        const probe = new Image();
        const objectUrl = URL.createObjectURL(file);
        probe.onload = ()=>{ const d = {width: probe.naturalWidth, height: probe.naturalHeight}; URL.revokeObjectURL(objectUrl); resolve(d); };
        probe.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('dimension probe failed')); };
        probe.src = objectUrl;
      });
      const scale = Math.min(1, maxDim / Math.max(dims.width, dims.height));
      const targetW = Math.max(1, Math.round(dims.width * scale));
      const targetH = Math.max(1, Math.round(dims.height * scale));
      bitmap = await createImageBitmap(file, {resizeWidth: targetW, resizeHeight: targetH, resizeQuality: 'medium'});
    }catch(e){
      bitmap = null; // fall through to the <img> based path below
    }
  }

  if(!bitmap){
    // Fallback for browsers without createImageBitmap resize support — same
    // canvas approach as before, kept only as a safety net.
    bitmap = await new Promise((resolve, reject)=>{
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = ()=>{ URL.revokeObjectURL(objectUrl); resolve(img); };
      img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('image load failed')); };
      img.src = objectUrl;
    });
    const scale = Math.min(1, maxDim / Math.max(bitmap.naturalWidth||bitmap.width, bitmap.naturalHeight||bitmap.height));
    const targetW = Math.max(1, Math.round((bitmap.naturalWidth||bitmap.width) * scale));
    const targetH = Math.max(1, Math.round((bitmap.naturalHeight||bitmap.height) * scale));
    const canvas = document.createElement('canvas');
    canvas.width = targetW; canvas.height = targetH;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, targetW, targetH);
    return new Promise((resolve)=>canvas.toBlob(resolve, 'image/jpeg', 0.82));
  }

  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width; canvas.height = bitmap.height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0);
  bitmap.close && bitmap.close();
  return new Promise((resolve)=>canvas.toBlob(resolve, 'image/jpeg', 0.82));
}

function processBillBlob(blob, statusEl){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    const dataUrl = e.target.result;
    const base64 = dataUrl.split(',')[1];

    statusEl.innerHTML = `
      <div class="card" style="text-align:center; padding:28px 16px;">
        <div style="font-size:32px; margin-bottom:8px;">🤖</div>
        <div style="font-weight:600;">${SETTINGS.lang==='hi'?'बिल पढ़ा जा रहा है...':'Reading the bill...'}</div>
        <div style="font-size:12px; color:var(--slate); margin-top:4px;">${SETTINGS.lang==='hi'?'इसमें कुछ सेकंड लग सकते हैं':'This may take a few seconds'}</div>
      </div>
    `;

    try{
      const products = await callGeminiForBillExtraction(base64, 'image/jpeg');
      if(!products || products.length===0){
        statusEl.innerHTML = `<div class="empty-state">${SETTINGS.lang==='hi'?'कोई प्रोडक्ट नहीं पहचाना जा सका। साफ़ फ़ोटो के साथ दोबारा कोशिश करें।':'Could not recognize any products. Try again with a clearer photo.'}</div>`;

    }
  };
  reader.readAsDataURL(blob);
}

async function callGeminiForBillExtraction(base64ImageData, mimeType){
  const apiKey = SETTINGS.geminiApiKey;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

  const prompt = `You are reading a wholesale footwear supplier's bill/invoice from a photo. Extract every line item as a product. For each item, return:
- name: product name/description as written
- brand: brand name if visible, else empty string
- size: size if visible, else empty string
- color: color if visible, else empty string
- qty: quantity (number)
- purchasePrice: per-unit price the shop is paying (number, no currency symbol)

Respond with ONLY a valid JSON array, no markdown, no explanation. Example format:
[{"name":"Comfort Sandal","brand":"Bata","size":"7","color":"Black","qty":10,"purchasePrice":450}]
If a field is not visible on the bill, use an empty string for text fields or 0 for numbers. If you cannot read the bill at all, return an empty array [].`;

  const body = {
    contents: [{
      parts: [
        {text: prompt},
        {inline_data: {mime_type: mimeType, data: base64ImageData}}
      ]
    }],
    generationConfig: {temperature: 0.1}
  };

  const response = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });

  if(!response.ok){
    const errText = await response.text().catch(()=>'');
    if(response.status === 400 && errText.includes('API_KEY_INVALID')){
      throw new Error(SETTINGS.lang==='hi' ? 'API key सही नहीं है, Settings में जांचें' : 'API key is invalid, check it in Settings');
    }
    if(response.status === 429){
      throw new Error(SETTINGS.lang==='hi' ? 'आज की मुफ़्त सीमा खत्म हो गई, कल फिर कोशिश करें' : "Today's free limit reached, try again tomorrow");
    }
    throw new Error(SETTINGS.lang==='hi' ? 'जवाब नहीं मिला, इंटरनेट जांचें' : 'No response received, check your internet');
  }

  const data = await response.json();
  const textOut = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
  const cleaned = textOut.replace(/```json|```/g, '').trim();

  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(e){
    throw new Error(SETTINGS.lang==='hi' ? 'जवाब समझ नहीं आया, दोबारा कोशिश करें' : 'Could not understand the response, try again');
  }
  if(!Array.isArray(parsed)) return [];
  return parsed.map(p=>({
    name: String(p.name||'').trim(),
    brand: String(p.brand||'').trim(),
    size: String(p.size||'').trim(),
    color: String(p.color||'').trim(),
    qty: parseInt(p.qty)||0,
    purchasePrice: parseFloat(p.purchasePrice)||0
  })).filter(p=>p.name);
}

function confirmBillScanImport(){
  if(_billScanResults.length===0){ showToast(t('common.required')); return; }
  const products = DB.get('products');
  let added = 0, restocked = 0, skipped = 0;
  _billScanResults.forEach(p=>{
    if(!p.name || !p.size || !p.color){ skipped++; return; }
    const existingIdx = findExistingProductMatch(products, p.brand||'GEN', p.name, p.size, p.color);
    const sku = existingIdx > -1 ? products[existingIdx].sku : generateNextSKU(products);

    if(existingIdx > -1){
      // Same product already in inventory (likely a restock from this same
      // wholesaler) — add to its existing quantity rather than discarding it,
      // and update its purchase price to the latest one from this bill.
      products[existingIdx].qty = Number(products[existingIdx].qty) + p.qty;
      products[existingIdx].purchasePrice = p.purchasePrice || products[existingIdx].purchasePrice;
      products[existingIdx].lastUpdated = nowISO();
      logStock(products[existingIdx].id, sku, 'in', p.qty, products[existingIdx].qty, SETTINGS.lang==='hi'?'AI बिल स्कैन (रीस्टॉक)':'AI Bill Scan (restock)', null);
      restocked++;
      return;
    }

    const newP = {
      id: uid('p_'), sku, barcode: generateBarcodeValue(),
      name: p.name, brand: p.brand||'Generic', category: CATEGORIES[0], gender: GENDERS[0], season:'All Season',
      size: p.size, color: p.color, purchasePrice: p.purchasePrice, sellingPrice: Math.round(p.purchasePrice*1.5), mrp: 0,
      qty: p.qty, supplier:'', rack:'', box:'', arrivalDate: new Date().toISOString().slice(0,10),
      lastUpdated: nowISO(), notes: SETTINGS.lang==='hi'?'AI बिल स्कैन से जोड़ा गया':'Added via AI Bill Scan'
    };
    products.push(newP);
    logStock(newP.id, sku, 'in', p.qty, p.qty, SETTINGS.lang==='hi'?'AI बिल स्कैन':'AI Bill Scan', null);
    added++;
  });
  DB.set('products', products);
  closeSheet();
  const parts = [];
  if(added>0) parts.push(`${added} ${SETTINGS.lang==='hi'?'नए जोड़े गए':'new added'}`);
  if(restocked>0) parts.push(`${restocked} ${SETTINGS.lang==='hi'?'रीस्टॉक हुए':'restocked'}`);
  if(skipped>0) parts.push(`${skipped} ${SETTINGS.lang==='hi'?'छोड़े गए (जानकारी अधूरी)':'skipped (incomplete info)'}`);
  showToast(`✅ ${parts.join(' · ')}`);
  if(currentScreen==='inventory') renderInventory();
  if(currentScreen==='dashboard') renderDashboard();
}


/* ===== thermal-printer.js ===== */
/* =========================================================================
   THERMAL PRINTER MODULE — direct ESC/POS printing over Web Bluetooth or
   Web USB, so receipts and barcode labels can print straight from the app
   without going through Android's generic Print dialog (which most cheap
   Bluetooth thermal printers don't show up in).

   Requirements:
   - Must be served over https:// (same restriction as camera — Web
     Bluetooth/USB are blocked entirely on file:// or content://).
   - Works in Chrome on Android. Most generic 58mm/80mm Bluetooth thermal
     printers (the kind sold for small shops) speak ESC/POS and expose a
     standard Serial Port Profile service that Web Bluetooth can reach.
   - USB requires an OTG cable connecting the phone to the printer.

   This module keeps the existing browser-print fallback (printReceipt /
   printBarcodeLabels in barcode.js) completely intact — those still work
   exactly as before for anyone without a paired printer. This adds a
   faster, direct-print path on top, used when a printer is connected.
   ========================================================================= */

let _thermalDevice = null;       // Bluetooth device or USB device, whichever is connected
let _thermalConnectionType = null; // 'bluetooth' | 'usb'
let _thermalCharacteristic = null; // Bluetooth GATT characteristic for writing
let _thermalUsbInterface = null;   // USB interface/endpoint info
let _lastBluetoothDevice = null;   // kept even after disconnect, so we can silently reconnect
                                    // without making the cashier open the device picker again
let _manualDisconnect = false;     // true only when the user explicitly tapped "Disconnect" —
                                    // an unexpected drop should auto-reconnect, a deliberate one shouldn't
let _reconnectAttempts = 0;
let _isPrinting = false;           // counter — truthy (>0) while any send is actively in progress
let _printWasInterrupted = false;  // set if a disconnect happened mid-print — the printer's internal
                                    // state (esp. mid-raster-image) is now unknown and must be reset
                                    // before anything else is sent, or it prints garbage indefinitely
let _keepAliveTimer = null;
let _wakeLock = null;

/* The keep-alive timer below only helps if it actually keeps firing. Mobile
   Chrome throttles/suspends setInterval on a hidden or screen-locked page to
   save battery — so the moment the phone's screen dims (which happens after
   a minute or two of no touches at a shop counter), the keep-alive bytes
   stop going out, and Android then kills the "idle" Bluetooth connection.
   This was the actual cause of the 3-4 minute disconnects: the timer itself
   was fine, it just wasn't running by minute 3. Holding a screen Wake Lock
   while a printer is connected keeps the screen (and the timer) alive. */
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      _wakeLock = await navigator.wakeLock.request('screen');
    }
  }catch(e){ /* not fatal — printer still works, screen may just dim again */ }
}
function releaseWakeLock(){
  if(_wakeLock){ _wakeLock.release().catch(()=>{}); _wakeLock = null; }
}
// Wake locks are auto-released whenever the tab is hidden (app switch, screen
// off via power button) — re-acquire as soon as it's visible again so a
// printer connection that survives a brief interruption doesn't silently
// lose its wake lock for the rest of the day.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && _thermalDevice && _thermalConnectionType === 'bluetooth'){
    acquireWakeLock();
  }
});

function startKeepAlive(){
  stopKeepAlive();
  // Android kills idle Bluetooth connections after ~1-2 minutes. Sending a
  // harmless null byte every 30 seconds keeps the GATT connection alive.
  // Most ESC/POS printers silently ignore a lone 0x00 byte.
  _keepAliveTimer = setInterval(async ()=>{
    if(!_thermalDevice || _thermalConnectionType !== 'bluetooth') return;
    try{
      await sendBytesToThermalPrinter(new Uint8Array([0x00]));
    }catch(e){
      onThermalPrinterDisconnected();
    }
  }, 30000);
}
function stopKeepAlive(){
  if(_keepAliveTimer){ clearInterval(_keepAliveTimer); _keepAliveTimer = null; }
}

/* Common ESC/POS service/characteristic UUIDs used by most generic thermal
   printers. Different brands sometimes use slightly different UUIDs, so we
   try a short list of the most common ones rather than a single guess. */
const THERMAL_BT_SERVICE_UUIDS = [
  '000018f0-0000-1000-8000-00805f9b34fb', // most common generic ESC/POS printer service
  '49535343-fe7d-4ae5-8fa9-9fafd205e455'  // alternate used by some printer chipsets
];

function isPrinterConnected(){
  return !!_thermalDevice;
}

function openConnectDevicesSheet(){
  openSheet(`
    <div class="sheet-header"><h2>${SETTINGS.lang==='hi'?'डिवाइस कनेक्ट करें':'Connect Devices'}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>

    <div class="eyebrow" style="margin-bottom:8px;">🖨️ ${SETTINGS.lang==='hi'?'थर्मल प्रिंटर':'Thermal Printer'}</div>
    <div class="card" style="text-align:center; padding:18px;">
      <div style="font-size:28px; margin-bottom:6px;">${isPrinterConnected() ? '🟢' : '⚪'}</div>
      <div style="font-weight:700; font-size:13.5px;">${isPrinterConnected() ? (SETTINGS.lang==='hi'?'प्रिंटर कनेक्ट है':'Printer Connected') : (SETTINGS.lang==='hi'?'कोई प्रिंटर कनेक्ट नहीं':'No Printer Connected')}</div>
      ${isPrinterConnected() ? `<div style="font-size:12px; color:var(--slate); margin-top:4px;">${esc(_thermalDevice.name || _thermalConnectionType)}</div>` : ''}
    </div>
    ${isPrinterConnected() ? `
      <div class="row" style="margin-bottom:18px;">
        <button class="btn btn-outline btn-block" onclick="testThermalPrint()">🖨️ ${SETTINGS.lang==='hi'?'टेस्ट प्रिंट':'Test Print'}</button>
        <button class="btn btn-danger btn-block" onclick="disconnectThermalPrinter()">${SETTINGS.lang==='hi'?'डिसकनेक्ट':'Disconnect'}</button>
      </div>
    ` : `
      <div class="row" style="margin-bottom:18px;">
        <button class="btn btn-peach btn-block" onclick="connectBluetoothPrinter()">🔵 Bluetooth</button>
        <button class="btn btn-outline btn-block" onclick="connectUSBPrinter()">🔌 USB</button>
      </div>
    `}

    <div class="eyebrow" style="margin-bottom:8px;">📷 ${SETTINGS.lang==='hi'?'बारकोड स्कैनर':'Barcode Scanner(s)'}</div>
    <div class="card">
      <p style="font-size:12.5px; color:var(--slate); margin:0 0 12px 0;">${SETTINGS.lang==='hi'
        ? 'स्कैनर गन एक कीबोर्ड की तरह काम करते हैं — इन्हें फ़ोन की सामान्य Bluetooth सेटिंग्स से पेयर करें। एक से ज़्यादा स्कैनर एक साथ काम कर सकते हैं, हर स्कैन सीधे ऐप में पहुंच जाएगा।'
        : 'Scanner guns work like a keyboard — pair them through the phone Bluetooth settings. More than one scanner can be paired and used at the same time; every scan reaches the app directly.'}</p>

    </div>

function openAndroidBluetoothSettings(){
