<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tariq Footwear">
<title>Tariq Footwear — POS</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="shortcut icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
:root{
  --peach:#241d17;
  --peach-deep:#c9a87c;
  --green:#1f2e26;
  --green-deep:#3d7a54;
  --charcoal:#ffffff;
  --cream:#0f0f0f;
  --terracotta:#e0574a;
  --slate:#9a958d;
  --white:#1a1a1a;
  --line:rgba(255,255,255,0.08);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 2px 10px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.25);
  --shadow-lift:0 8px 24px rgba(0,0,0,0.5);
  --font-display:'Poppins','Noto Sans Devanagari',sans-serif;
  --font-body:'Inter','Noto Sans Devanagari',sans-serif;
}
[data-theme="dark"]{
  --cream:#0f0f0f;
  --charcoal:#ffffff;
  --white:#1a1a1a;
  --line:rgba(255,255,255,0.08);
  --slate:#9a958d;
  --peach:#241d17;
  --peach-deep:#c9a87c;
  --green:#1f2e26;
  --green-deep:#3d7a54;
  --shadow:0 2px 10px rgba(0,0,0,0.35);
  --shadow-lift:0 8px 24px rgba(0,0,0,0.5);
}
/* Light mode kept only as a fallback toggle — the rose-gold/matte look above
   (identical token values) is now the app's default surface. */
[data-theme="light"]{
  --peach:#FFD6C2;
  --peach-deep:#FFC1A3;
  --green:#A8D5BA;
  --green-deep:#8AC2A3;
  --charcoal:#2B2420;
  --cream:#FFF8F2;
  --terracotta:#C76B4A;
  --slate:#5C6B66;
  --white:#FFFFFF;
  --line:#EDE2D8;
  --shadow:0 2px 10px rgba(43,36,32,0.06), 0 1px 2px rgba(43,36,32,0.04);
  --shadow-lift:0 8px 24px rgba(43,36,32,0.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--charcoal);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  transition:background 0.25s,color 0.25s;
}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}

#app{
  max-width:560px;
  margin:0 auto;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  background:var(--cream);
}

.screen{display:none; flex:1; padding:16px 16px 90px 16px; animation:fadeIn 0.22s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

h1,h2,h3{font-family:var(--font-display); margin:0; color:var(--charcoal);}
.eyebrow{font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--slate); font-weight:700; margin-bottom:4px;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:var(--radius-sm); cursor:pointer;
  font-family:var(--font-display); font-weight:600; font-size:15px;
  padding:14px 20px; transition:transform 0.08s, box-shadow 0.15s, opacity 0.15s;
  user-select:none;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green-deep); color:#fff; box-shadow:var(--shadow);}
.btn-peach{background:var(--peach-deep); color:var(--charcoal); box-shadow:var(--shadow);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--charcoal);}
.btn-danger{background:var(--terracotta); color:#fff;}
.btn-block{width:100%;}
.btn-lg{padding:18px 22px; font-size:17px; border-radius:var(--radius);}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

.card{
  background:var(--white); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
  border:1px solid var(--line); color:inherit;
}

.input-group{margin-bottom:14px;}
.input-label{font-size:13px; font-weight:600; color:var(--slate); margin-bottom:6px; display:block;}
.input-field{
  width:100%; padding:13px 14px; border-radius:var(--radius-sm);
  border:1.5px solid var(--line); background:var(--cream); color:var(--charcoal);
  font-size:15px; outline:none; transition:border-color 0.15s;
}
.input-field:focus{border-color:var(--green-deep);}
select.input-field{appearance:none;}

.row{display:flex; gap:10px;}
.row > *{flex:1;}

.badge{display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;}
.badge-green{background:var(--green); color:#1d3a2a;}
.badge-terracotta{background:#F3D8CB; color:var(--terracotta);}
.badge-peach{background:var(--peach); color:#7a4527;}
.badge-gray{background:var(--line); color:var(--slate);}
[data-theme="dark"] .badge-green{color:#7fd9a0;}
[data-theme="dark"] .badge-peach{color:var(--peach-deep);}

.empty-state{text-align:center; padding:50px 20px; color:var(--slate);}
.empty-state .icon{font-size:42px; margin-bottom:10px; opacity:0.6;}

.topbar{
  position:sticky; top:0; z-index:30; background:var(--cream);
  padding:16px 16px 10px 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.topbar h1{font-size:19px; font-weight:700;}
.topbar .sub{font-size:12px; color:var(--slate); margin-top:1px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--white);
  display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer;
  box-shadow:var(--shadow); flex-shrink:0;
}

.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  max-width:560px; margin:0 auto;
  background:var(--white); border-top:1px solid var(--line);
  display:flex; justify-content:space-around; padding:8px 4px 10px 4px;
  box-shadow:0 -4px 16px rgba(43,36,32,0.06);
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; cursor:pointer; color:var(--slate);
  font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px; flex:1;
  font-family:var(--font-body);
}
.nav-item .nav-icon{font-size:21px; line-height:1;}
.nav-item.active{color:var(--charcoal);}
.nav-item.active .nav-icon{transform:scale(1.08);}

#screen-login{
  min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:30px; text-align:center;
}
.login-logo{
  width:92px; height:92px; border-radius:24px;
  box-shadow:var(--shadow-lift); margin-bottom:16px; object-fit:cover;
}
.login-title{font-family:var(--font-display); font-size:24px; font-weight:800; margin-bottom:2px;}
.login-tagline{font-size:11.5px; letter-spacing:0.06em; color:var(--terracotta); font-weight:700; margin-bottom:10px; text-transform:uppercase;}
.login-sub{color:var(--slate); font-size:13.5px; margin-bottom:30px;}
.pin-dots{display:flex; gap:14px; margin-bottom:26px;}
.pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); transition:all 0.15s;}
.pin-dot.filled{background:var(--green-deep); border-color:var(--green-deep);}
.pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:280px;}
.pin-key{
  aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); background:var(--white);
  font-size:22px; font-weight:600; font-family:var(--font-display); cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--charcoal);
  box-shadow:var(--shadow);
}
.pin-key:active{transform:scale(0.94); background:var(--peach);}
.pin-key.fn{background:transparent; box-shadow:none; border:none; font-size:18px;}
.login-error{color:var(--terracotta); font-size:13px; font-weight:600; margin-top:14px; min-height:18px;}

.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
.stat-card{
  background:var(--white); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);
  border:1px solid var(--line); position:relative; overflow:hidden;
}
.stat-card .stat-label{font-size:11.5px; color:var(--slate); font-weight:600; margin-bottom:6px;}
.stat-card .stat-value{font-family:var(--font-display); font-size:21px; font-weight:800;}
.stat-card.accent-green{background:linear-gradient(160deg,var(--green) 0%, var(--white) 75%);}
.stat-card.accent-peach{background:linear-gradient(160deg,var(--peach) 0%, var(--white) 75%);}
.stat-card.wide{grid-column:1 / -1;}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:20px 0 10px 0;}
.section-title h3{font-size:15.5px; font-weight:700;}
.section-title .link{font-size:12.5px; color:var(--terracotta); font-weight:700; cursor:pointer; background:none; border:none;}

.quick-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:6px;}
.qa-btn{
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 12px; display:flex; flex-direction:column; align-items:center; gap:6px;
  box-shadow:var(--shadow); cursor:pointer; font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--charcoal);
}
.qa-btn .qa-icon{font-size:24px;}
.qa-btn:active{transform:scale(0.97);}

.alert-strip{
  display:flex; align-items:center; gap:10px; background:#FBEAE0; border:1px solid #F0CBB8;
  border-radius:var(--radius-sm); padding:11px 13px; margin-bottom:10px; font-size:13px; font-weight:600; color:var(--terracotta);
  cursor:pointer;
}
[data-theme="dark"] .alert-strip{background:rgba(201,168,124,0.12); border-color:rgba(201,168,124,0.3);}

.shoebox-card{
  background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--line);
  margin-bottom:12px; overflow:hidden; cursor:pointer; position:relative;
}
.shoebox-top{display:flex; align-items:stretch;}
.shoebox-main{flex:1; padding:13px 14px; min-width:0;}
.shoebox-brand{font-size:10.5px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:0.04em;}
.shoebox-model{font-family:var(--font-display); font-size:15.5px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.shoebox-meta{font-size:12px; color:var(--slate); margin-top:4px;}
.shoebox-tag{
  width:64px; flex-shrink:0; background:var(--peach); display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; border-left:1px dashed #D9A483;
}
.shoebox-tag::before, .shoebox-tag::after{
  content:''; position:absolute; width:10px; height:10px; border-radius:50%; background:var(--cream); left:-5px;
}
.shoebox-tag::before{top:-5px;}
.shoebox-tag::after{bottom:-5px;}
.shoebox-tag .tag-size{font-family:var(--font-display); font-weight:800; font-size:17px; color:#7a4527;}
.shoebox-tag .tag-label{font-size:8.5px; color:#7a4527; font-weight:700; text-transform:uppercase;}
[data-theme="dark"] .shoebox-tag .tag-size,[data-theme="dark"] .shoebox-tag .tag-label{color:var(--peach-deep);}
.shoebox-bottom{display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid var(--line); background:rgba(168,213,186,0.08);}
.shoebox-price{font-family:var(--font-display); font-weight:700; font-size:14px;}
.shoebox-qty{font-size:12px; font-weight:700;}
.qty-ok{color:#3d7a52;}
.qty-low{color:var(--terracotta);}
.qty-out{color:#a33;}

.overlay{
  position:fixed; inset:0; background:rgba(43,36,32,0.45); z-index:90; display:none;
  align-items:flex-end; justify-content:center;
}
.overlay.active{display:flex;}
.sheet{
  background:var(--cream); width:100%; max-width:560px; border-radius:22px 22px 0 0;
  max-height:92vh; overflow-y:auto; padding:18px 18px 28px 18px; animation:slideUp 0.22s ease;
}
@keyframes slideUp{from{transform:translateY(40px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:38px; height:4px; background:var(--line); border-radius:4px; margin:0 auto 14px auto;}
.sheet-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.sheet-header h2{font-size:18px;}

.toast{
  position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:100;
  background:var(--charcoal); color:var(--cream); padding:12px 20px; border-radius:30px;
  font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lift); opacity:0; transition:opacity 0.25s, bottom 0.25s;
  pointer-events:none; max-width:85%; text-align:center;
}
.toast.show{opacity:1; bottom:115px;}

.fab{
  position:fixed; bottom:90px; right:calc(50% - 280px + 16px); z-index:35;
  width:56px; height:56px; border-radius:50%; background:var(--green-deep); color:#fff;
  border:none; box-shadow:var(--shadow-lift); font-size:26px; display:flex; align-items:center; justify-content:center; cursor:pointer;
}
@media (max-width:592px){ .fab{right:16px;} }

.search-bar{display:flex; gap:8px; margin-bottom:14px;}
.search-bar .input-field{flex:1;}

table.report-table{width:100%; border-collapse:collapse; font-size:13px;}
table.report-table th{text-align:left; padding:8px 6px; color:var(--slate); font-weight:700; font-size:11.5px; border-bottom:2px solid var(--line);}
table.report-table td{padding:9px 6px; border-bottom:1px solid var(--line);}
table.report-table tr:last-child td{border-bottom:none;}

.tab-pills{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px;}
.tab-pill{flex-shrink:0; padding:9px 16px; border-radius:20px; background:var(--white); border:1.5px solid var(--line); font-size:13px; font-weight:600; cursor:pointer; color:var(--slate);}
.tab-pill.active{background:var(--green-deep); color:#fff; border-color:var(--green-deep);}

.lang-toggle{display:flex; background:var(--white); border-radius:20px; padding:3px; border:1px solid var(--line);}
.lang-toggle button{flex:1; padding:6px 12px; border-radius:18px; border:none; background:none; font-size:12.5px; font-weight:700; color:var(--slate); cursor:pointer;}
.lang-toggle button.active{background:var(--green-deep); color:#fff;}

.cart-item{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
.cart-item:last-child{border-bottom:none;}
.cart-qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-btn{width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:var(--cream); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}

#scanner-overlay{position:fixed; inset:0; background:#000; z-index:200; display:none; flex-direction:column;}
#scanner-overlay.active{display:flex;}
#scanner-video{flex:1; object-fit:cover; width:100%;}
.scanner-frame{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:78%; height:140px; border:3px solid var(--green); border-radius:14px; box-shadow:0 0 0 2000px rgba(0,0,0,0.45);}
.scanner-close{position:absolute; top:18px; right:18px; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.92); border:none; font-size:18px; z-index:5;}
.scanner-controls{position:absolute; top:18px; left:18px; display:flex; gap:10px; z-index:5;}
.scanner-ctrl-btn{width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.92); border:none; font-size:17px; display:flex; align-items:center; justify-content:center;}
#splash-screen{
  position:fixed; inset:0; z-index:999; background:linear-gradient(165deg,var(--peach) 0%, var(--cream) 55%, var(--green) 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.4s ease, visibility 0.4s ease;
}
#splash-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }
#splash-screen img{ width:104px; height:104px; border-radius:26px; box-shadow:var(--shadow-lift); margin-bottom:18px; object-fit:cover; animation:splashPop 0.5s ease; }
#splash-screen .splash-title{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--charcoal); }
#splash-screen .splash-tag{ font-size:11px; letter-spacing:0.08em; color:var(--terracotta); font-weight:700; text-transform:uppercase; margin-top:4px; }
@keyframes splashPop{ from{transform:scale(0.85); opacity:0;} to{transform:scale(1); opacity:1;} }
</style>
</head>
<body>

<div id="splash-screen">
  <img src="./icon-192.jpg" alt="Tariq Footwear">
  <div class="splash-title">Tariq Footwear</div>
  <div class="splash-tag">Style • Comfort • Quality</div>
</div>

<div id="app">

  <div id="screen-login">
    <img class="login-logo" src="./icon-192.jpg" alt="Tariq Footwear">
    <div class="login-title" id="login-title">Tariq Footwear</div>
    <div class="login-tagline">Style • Comfort • Quality</div>

    <!-- Shop Selection (shown first) -->
    <div id="shop-select-section" style="width:100%; max-width:280px; margin-bottom:20px;">
      <div style="font-size:13px; color:var(--slate); margin-bottom:12px; text-align:center;">दुकान चुनें / Select Shop</div>
      <div style="display:flex; gap:12px;">
        <button onclick="selectShop('shop1')" id="btn-shop1" style="
          flex:1; padding:16px 8px; border-radius:var(--radius); border:2px solid var(--line);
          background:var(--white); font-family:var(--font-display); font-weight:700; font-size:14px;
          cursor:pointer; color:var(--charcoal);">
          🏪<br>दुकान 1<br><span style="font-size:11px; font-weight:400; color:var(--slate);">Shop 1</span>
        </button>
        <button onclick="selectShop('shop2')" id="btn-shop2" style="
          flex:1; padding:16px 8px; border-radius:var(--radius); border:2px solid var(--line);
          background:var(--white); font-family:var(--font-display); font-weight:700; font-size:14px;
          cursor:pointer; color:var(--charcoal);">
          🏬<br>दुकान 2<br><span style="font-size:11px; font-weight:400; color:var(--slate);">Shop 2</span>
        </button>
      </div>
    </div>

    <div class="login-sub" id="login-sub" style="display:none;">PIN दर्ज करें / Enter your PIN</div>
    <div class="pin-dots" id="pin-dots" style="display:none;"></div>
    <div class="pin-pad" id="pin-pad" style="display:none;"></div>
    <div class="login-error" id="login-error"></div>
  </div>

  <div id="main-app" style="display:none; flex:1; display:flex; flex-direction:column;">

    <div class="topbar">
      <div>
        <h1 id="topbar-title">Dashboard</h1>
        <div class="sub" id="topbar-sub">Tariq Footwear</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" onclick="openScanner('global')" title="Scan">📷</button>
        <button class="icon-btn" onclick="nav('settings')" title="Settings">⚙️</button>
      </div>
    </div>

    <div class="screen active" id="screen-dashboard"></div>
    <div class="screen" id="screen-inventory"></div>
    <div class="screen" id="screen-sale"></div>
    <div class="screen" id="screen-reports"></div>
    <div class="screen" id="screen-more"></div>
    <div class="screen" id="screen-settings"></div>

    <button class="fab" id="fab-add" onclick="openAddProduct()" style="display:none;">+</button>

    <div class="bottom-nav">
      <button class="nav-item active" data-nav="dashboard" onclick="nav('dashboard')"><span class="nav-icon">🏠</span><span data-i18n="nav.home">होम</span></button>
      <button class="nav-item" data-nav="inventory" onclick="nav('inventory')"><span class="nav-icon">📦</span><span data-i18n="nav.inventory">स्टॉक</span></button>
      <button class="nav-item" data-nav="sale" onclick="nav('sale')"><span class="nav-icon">🧾</span><span data-i18n="nav.sale">बिक्री</span></button>
      <button class="nav-item" data-nav="reports" onclick="nav('reports')"><span class="nav-icon">📊</span><span data-i18n="nav.reports">रिपोर्ट</span></button>
      <button class="nav-item" data-nav="more" onclick="nav('more')"><span class="nav-icon">⋯</span><span data-i18n="nav.more">और</span></button>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="if(event.target===this) closeSheet()">
    <div class="sheet" id="sheet"></div>

/* ===== storage.js ===== */
/* =========================================================================
   TARIQ FOOTWEAR — STORAGE SERVICE LAYER
   ---------------------------------------------------------------------
   This is a thin abstraction over the actual storage backend. Right now
   the only implemented backend is localStorage (offline, free, instant —
   correct choice for a single-phone shop with no server). Every other
   module in this app talks to data ONLY through the StorageService
   interface below, never directly to localStorage.

   WHY THIS MATTERS FOR FUTURE AWS MIGRATION:
   If you later want this app to sync to a cloud database (so multiple
   phones/staff can share one inventory, or you want a web backend), you
   only need to write a new backend class that implements the same five
   methods (get, set, getSettings, setSettings, exportAll/importAll) and
   swap it in at the bottom of this file. Nothing in dashboard.js,
   inventory.js, sales.js etc. needs to change, because they never touch
   localStorage directly — they only call StorageService.*

   A real AWS version would replace LocalStorageBackend with something like:
     class ApiBackend {
       async get(key){ return fetch(`/api/${key}`).then(r=>r.json()); }
       async set(key,val){ return fetch(`/api/${key}`, {method:'PUT', body:JSON.stringify(val)}); }
       ...
     }
   and the rest of the app would keep working unchanged, except calls would
   need to be awaited (this localStorage version is synchronous for speed
   and simplicity; an API-backed version would be asynchronous).
   ========================================================================= */

const STORAGE_COLLECTIONS = [
  'products','sales','purchases','stockLog','returns','suppliers',
  'customers','employees','damageStock','loginLog','expenses'
];

/* =========================================================================

/* Collections shared between both shops (single source of truth) */
const SHARED_COLLECTIONS = ['products','suppliers','employees'];
/* Collections that are per-shop (each shop has its own sales, logs etc) */
const SHOP_COLLECTIONS = ['sales','purchases','stockLog','returns','customers','damageStock','loginLog','expenses'];

/* =========================================================================
   FIREBASE BACKEND — real-time Firestore sync with offline localStorage cache
   ========================================================================= */
class FirebaseBackend {
  constructor(){
    this._cache = {}; // in-memory cache so DB.get() is always synchronous
    this._shopId = localStorage.getItem('tf_shopId') || 'shop1';
    this._initialized = false;
    this._listeners = {};
    this._db = null;
    STORAGE_COLLECTIONS.forEach(k => {
      try{ this._cache[k] = JSON.parse(localStorage.getItem('tf_'+k)) || []; }
      catch(e){ this._cache[k] = []; }
    });
  }

  async init(){
    if(this._initialized) return;
    try{
      const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
      const { getFirestore, collection, getDocs, doc, setDoc, onSnapshot, writeBatch, serverTimestamp }
        = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

      this._firebase = { collection, getDocs, doc, setDoc, onSnapshot, writeBatch, serverTimestamp };
      const app = initializeApp(FIREBASE_CONFIG);
      this._db = getFirestore(app);
      this._initialized = true;

      // Load all data from Firestore once, then set up real-time listeners
      await this._initialLoad();
      this._setupListeners();
      showToast(SETTINGS.lang==='hi' ? '☁️ Firebase से कनेक्ट हो गया' : '☁️ Connected to Firebase', 2500);
    }catch(err){
      console.error('Firebase init failed:', err);
      showToast(SETTINGS.lang==='hi'
        ? '⚠️ Firebase कनेक्ट नहीं हुआ, offline mode में चल रहा है'
        : '⚠️ Firebase offline, running in local mode', 3000);
    }
  }

  _collPath(key){
    // Shared collections live at top level, shop-specific ones under shop ID
    if(SHARED_COLLECTIONS.includes(key)) return key;
    return `shops/${this._shopId}/${key}`;
  }

  async _initialLoad(){
    const { collection, getDocs } = this._firebase;
    for(const key of STORAGE_COLLECTIONS){
      try{
        const snap = await getDocs(collection(this._db, this._collPath(key)));
        const items = [];
        snap.forEach(d => items.push({...d.data(), id: d.id}));
        if(items.length > 0){
          this._cache[key] = items;
          localStorage.setItem('tf_'+key, JSON.stringify(items));
        }
      }catch(e){ /* use cache */ }
    }
  }

  _setupListeners(){
    const { collection, onSnapshot } = this._firebase;
    STORAGE_COLLECTIONS.forEach(key => {
      try{
        const unsubscribe = onSnapshot(
          collection(this._db, this._collPath(key)),
          (snap) => {
            const items = [];
            snap.forEach(d => items.push({...d.data(), id: d.id}));
            this._cache[key] = items;
            localStorage.setItem('tf_'+key, JSON.stringify(items));
            // Re-render current screen if it shows this data
            if(typeof currentScreen !== 'undefined'){
              if(key==='products' && currentScreen==='inventory') renderInventory();
              if(key==='products' && currentScreen==='dashboard') renderDashboard();
              if(key==='sales' && currentScreen==='dashboard') renderDashboard();
            }
          },
          (err) => console.warn('Listener error:', key, err)
        );
        this._listeners[key] = unsubscribe;
      }catch(e){}
    });
  }

  get(key){
    return this._cache[key] || [];
  }

  set(key, val){
    // Always update cache + localStorage immediately (offline-first)
    this._cache[key] = val;
    try{ localStorage.setItem('tf_'+key, JSON.stringify(val)); }catch(e){}

    // Fire-and-forget sync to Firestore
    if(this._initialized && this._db){
      this._syncToFirestore(key, val).catch(err => console.warn('Sync error:', key, err));
    }
    return true;
  }

  async _syncToFirestore(key, val){
    const { collection, doc, writeBatch } = this._firebase;
    const colRef = collection(this._db, this._collPath(key));

    // Write in batches of 500 (Firestore limit per batch)
    const chunks = [];
    for(let i=0; i<val.length; i+=400) chunks.push(val.slice(i,i+400));

    for(const chunk of chunks){
      const batch = writeBatch(this._db);
      chunk.forEach(item => {
        if(!item || !item.id) return;
        batch.set(doc(colRef, item.id), item, {merge: true});
      });
      await batch.commit();
    }
  }

  getSettings(){
    const defaults = {
      shopName:'Tariq Footwear', tagline:'Style • Comfort • Quality',
      lang:'hi', theme:'dark', pin:'1234',
      lowStockThreshold:3, deadStockDays:90, currency:'₹',
      gstEnabled:false, gstPercent:5, gstNumber:'',
      shopAddress:'', shopPhone:'',
      geminiApiKey:'',
      loggedInEmployeeId:null,
      shopId: this._shopId
    };
    try{
      return Object.assign({}, defaults, JSON.parse(localStorage.getItem('tf_settings')) || {});
    }catch(e){ return defaults; }
  }

  setSettings(s){
    try{ localStorage.setItem('tf_settings', JSON.stringify(s)); return true; }
    catch(e){ return false; }
  }

  exportAll(){
    const out = {settings: this.getSettings(), _exportedAt: new Date().toISOString(), _appVersion:'2.0-firebase'};
    STORAGE_COLLECTIONS.forEach(k => out[k] = this.get(k));
    return out;
  }

  importAll(obj){
    if(obj.settings) this.setSettings(obj.settings);
    STORAGE_COLLECTIONS.forEach(k => { if(obj[k]) this.set(k, obj[k]); });
    return true;
  }

  clearAll(){
    STORAGE_COLLECTIONS.forEach(k => { this._cache[k]=[]; localStorage.removeItem('tf_'+k); });
  }

  setShop(shopId){
    this._shopId = shopId;
    localStorage.setItem('tf_shopId', shopId);
    // Teardown old listeners
    Object.values(this._listeners).forEach(u => { try{ u(); }catch(e){} });
    this._listeners = {};
    if(this._initialized){ this._initialLoad().then(()=>this._setupListeners()); }
  }
}

class LocalStorageBackend {
  get(key){
    try{ return JSON.parse(localStorage.getItem('tf_'+key)) || []; }
    catch(e){ return []; }
  }

    try{
      localStorage.setItem('tf_'+key, JSON.stringify(val));
      return true;
    }catch(e){
      if(typeof showToast === 'function'){

          : '⚠️ Storage is full! Please back up from Settings and clear old data.', 6000);
      }
      return false;
    }
  }
  getSettings(){
    const defaults = {
      shopName:'Tariq Footwear', tagline:'Style • Comfort • Quality',
      lang:'hi', theme:'dark', pin:'1234',
      lowStockThreshold:3, deadStockDays:90, currency:'₹',
      gstEnabled:false, gstPercent:5, gstNumber:'',
      shopAddress:'', shopPhone:'',
      geminiApiKey:'',
      loggedInEmployeeId:null
    };
    try{
      return Object.assign({}, defaults, JSON.parse(localStorage.getItem('tf_settings')) || {});
    }catch(e){ return defaults; }
  }
  setSettings(s){
    try{ localStorage.setItem('tf_settings', JSON.stringify(s)); return true; }
    catch(e){ return false; }
  }
  exportAll(){
    const out = {settings: this.getSettings(), _exportedAt: new Date().toISOString(), _appVersion:'2.0'};
    STORAGE_COLLECTIONS.forEach(k => out[k] = this.get(k));
    return out;
  }
  importAll(obj){
    if(obj.settings) this.setSettings(obj.settings);
    STORAGE_COLLECTIONS.forEach(k => { if(obj[k]) this.set(k, obj[k]); });
    return true;
  }
  clearAll(){
    STORAGE_COLLECTIONS.forEach(k => localStorage.removeItem('tf_'+k));
  }
}

/* ---------------------------------------------------------------------
   UTILITIES
   ------------------------------------------------------------------- */
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}) + ', ' + d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
}
function money(n){
  n = Number(n)||0;
  return SETTINGS.currency + n.toLocaleString('en-IN', {maximumFractionDigits:0});
}
function isSameDay(iso, ref){
  const a = new Date(iso), b = ref || new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function daysAgo(iso){
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function startOfWeek(){
  const d = new Date(); const day = d.getDay();
  const diff = d.getDate() - day + (day===0?-6:1);
  const monday = new Date(d.setDate(diff));
  monday.setHours(0,0,0,0);
  return monday;
}
function startOfMonth(){
  const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d;
}
function startOfYear(){
  const d = new Date(); d.setMonth(0,1); d.setHours(0,0,0,0); return d;
}
/* Rolling windows (last 7 / last 30 days from today), used specifically
   wherever "this week" and "this month" are shown side by side for direct
   comparison (dashboard cards, profit/loss table). Calendar week (Monday-
   start) and calendar month (1st-start) don't nest inside each other near
   the start of a month — e.g. on Aug 2, "this week" starts Jul 27 but "this
   month" starts Aug 1, so a week total could include 5 more days of sales
   than the month total and end up LARGER, which looks like broken data even
   though each number was individually correct. Rolling windows guarantee
   the last-30-days total always contains the last-7-days total, so this
   can't happen. Calendar-based startOfWeek/startOfMonth are kept as-is for
   the standalone Reports screen, where picking "August" specifically (not
   "last 30 days") is the actually useful, intentional behavior.*/
function rollingWeekStart(){
  const d = new Date(); d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d;
}
function rollingMonthStart(){
  const d = new Date(); d.setDate(d.getDate()-29); d.setHours(0,0,0,0); return d;
}
function showToast(msg, ms=2200){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove('show'), ms);
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function csvEscape(v){
  v = String(v==null?'':v);
  if(/[",\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function downloadCSV(filename, rows){
  const csv = rows.map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Simple numeric SKU: 1, 2, 3... so a non-literate shopkeeper can find a
   product by typing/reading one short number instead of a brand/size code.
   Never reused: always current-max + 1, scanned from whatever product list
   is passed in (so it stays correct mid-batch-import too). */
function generateNextSKU(products){
  const list = products || DB.get('products') || [];
  let max = 0;
  list.forEach(p=>{ const n = parseInt(p.sku, 10); if(!isNaN(n) && n > max) max = n; });
  return String(max + 1);
}
/* Matches on brand+name+size+color (case/space-insensitive) to detect
   "is this the same product already in inventory" for restock flows —
   this used to be done by re-deriving the old SKU, but SKU is now a plain
   incrementing number and can't be used for matching. */
function findExistingProductMatch(products, brand, name, size, color){
  const norm = s => String(s||'').trim().toLowerCase();
  return products.findIndex(x=>
    norm(x.brand)===norm(brand) && norm(x.name)===norm(name) &&
    norm(x.size)===norm(size) && norm(x.color)===norm(color)
  );
}
/* Barcode value: 6 pure digits.
   Kept deliberately short: every extra digit adds bars, and on a small
   "mobile" Bluetooth thermal printer the print head itself is only ~300-380
   dots wide. The old 9-digit code (plus start/checksum/stop bars) was
   landing right at — and past — that edge, so the last digit's bars were
   physically off the printable area and never printed at all; no amount of
   software chunking fixes could help there, since the printer was simply
   asked to print wider than it physically can. 6 digits (100000-999999,
   900,000 possible codes, checked for collisions below) leaves enough
   headroom that we can also print each bar module a bit thicker (see
   printBarcodeLabelThermal) for a darker, easier one-scan read on faint
   thermal paper, without the total width creeping back out past the edge. */
function generateBarcodeValue(products){
  const list = products || DB.get('products') || [];
  const existing = new Set(list.map(p=>String(p.barcode)));
  let code;
  do{
    code = String(Math.floor(Math.random()*900000)+100000);
  }while(existing.has(code));
  return code;
}

/* ---------------------------------------------------------------------
   SOUND FEEDBACK — short beeps for scan success/error (Web Audio API,
   no audio files needed, works fully offline).
   ------------------------------------------------------------------- */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return _audioCtx;
}
function playBeep(freq, durationMs, type){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + durationMs/1000);
    osc.stop(ctx.currentTime + durationMs/1000);
  }catch(e){ /* ignore audio errors silently, never block app flow */ }
}
function playScanSuccessSound(){ playBeep(1400, 110, 'sine'); }
function playScanErrorSound(){
  playBeep(280, 160, 'square');
  setTimeout(()=>playBeep(220, 180, 'square'), 140);
}

/* ---------------- BARCODE CORRUPTION MIGRATION ---------------- */
// Older versions of the app sent ESC/POS CODE128 barcodes with a "{B" prefix
// that cheap printer chipsets mishandled — they printed the literal "B" into
// the human-readable text, making the scanner read e.g. "B890801285287"
// instead of the stored "TF890801285287". This runs once after login and
// silently patches any such corrupted barcode values in the DB so they match
// what the new fixed labels will print going forward.
function migrateCorruptedBarcodes(){
  if(localStorage.getItem('tf_barcode_migration_v1')) return; // already done
  const products = DB.get('products');
  let fixed = 0;
  products.forEach(p=>{
    // A corrupted barcode looks like it starts with just digits or a lone "B"
    // followed by digits, with no "TF" prefix — meaning the TF prefix was lost.
    // We regenerate a fresh barcode value for these rather than trying to
    // reverse-engineer the original, since the old corrupted value is now
    // unreadable by scanners anyway (the bar pattern itself was corrupt too).
    if(p.barcode && /^B\d{10,}$/.test(p.barcode)){
      p.barcode = generateBarcodeValue();
      p.lastUpdated = nowISO();
      fixed++;
    }
  });
  if(fixed > 0){
    DB.set('products', products);
    showToast((SETTINGS.lang==='hi'
      ? fixed + ' पुराने बारकोड अपने-आप ठीक हो गए — नए लेबल प्रिंट करें'
      : fixed + ' old barcodes auto-fixed — please reprint labels'), 4000);
  }
  localStorage.setItem('tf_barcode_migration_v1', '1');
}

function computeDashboardStats(){
  const products = DB.get('products');
  const sales = DB.get('sales');
  const totalProducts = products.length;
  const totalQty = products.reduce((s,p)=>s+Number(p.qty||0),0);
  const totalValue = products.reduce((s,p)=>s+Number(p.qty||0)*Number(p.purchasePrice||0),0);
  const lowStockThreshold = Number(SETTINGS.lowStockThreshold||3);
  const lowStock = products.filter(p=>Number(p.qty)>0 && Number(p.qty)<=lowStockThreshold).length;
  const outOfStock = products.filter(p=>Number(p.qty)<=0).length;

  const today = new Date();
  const weekStart = rollingWeekStart();
  const monthStart = rollingMonthStart();

  let todaySales=0, weekSales=0, monthSales=0, todayProfit=0, weekProfit=0, monthProfit=0;
  sales.forEach(s=>{
    const d = new Date(s.dateISO);
    const total = Number(s.total||0);
    let cost = 0;
    (s.items||[]).forEach(it=> cost += Number(it.cost||0)*Number(it.qty||0));
    const profit = total - cost;
    if(isSameDay(s.dateISO, today)){ todaySales+=total; todayProfit+=profit; }
    if(d >= weekStart){ weekSales+=total; weekProfit+=profit; }
    if(d >= monthStart){ monthSales+=total; monthProfit+=profit; }
  });

  const todayExpenses = DB.get('expenses').filter(e=>isSameDay(e.dateISO, today)).reduce((sum,e)=>sum+Number(e.amount||0),0);

  return {totalProducts, totalQty, totalValue, lowStock, outOfStock, todaySales, weekSales, monthSales, todayProfit, weekProfit, monthProfit, todayExpenses};
}

/* =========================================================================
   INVENTORY MODULE — list, add, edit, delete, stock in/out, adjustment,
   damage stock. Extended for ladies + men's + kids footwear retail.
   ========================================================================= */
const CATEGORIES = ['Shoes','Sandals','Slippers','Sports Shoes','Formal Shoes','School Shoes','Sneakers','Boots','Heels','Flats'];
const CATEGORY_LABELS_HI = {
  'Shoes':'जूते','Sandals':'सैंडल','Slippers':'चप्पल','Sports Shoes':'स्पोर्ट्स शूज़',
  'Formal Shoes':'फॉर्मल शूज़','School Shoes':'स्कूल शूज़','Sneakers':'स्नीकर्स','Boots':'बूट्स',
  'Heels':'हील्स','Flats':'फ्लैट्स'
};
function categoryLabel(c){ return SETTINGS.lang==='hi' ? (CATEGORY_LABELS_HI[c]||c) : c; }

const GENDERS = ['Ladies','Mens','Kids'];
function genderLabel(g){
  const map = {hi:{Ladies:'लेडीज़',Mens:'मेंस',Kids:'किड्स'}, en:{Ladies:'Ladies',Mens:"Men's",Kids:'Kids'}};
  return (map[SETTINGS.lang]||map.en)[g] || g;
}
const SEASONS = ['All Season','Summer','Winter','Monsoon'];
function seasonLabel(s){
  const map = {hi:{'All Season':'सभी सीज़न','Summer':'गर्मी','Winter':'सर्दी','Monsoon':'मॉनसून'}, en:{}};
  return (map[SETTINGS.lang]||{})[s] || s;
}

let invFilter = {category:'all', gender:'all', query:''};

function renderInventory(){
  const products = DB.get('products');
  const screen = document.getElementById('screen-inventory');

  const cats = ['all', ...CATEGORIES.filter(c=>products.some(p=>p.category===c))];
  const pillsHtml = cats.map(c=>`
    <button class="tab-pill ${invFilter.category===c?'active':''}" onclick="setInvFilter('category','${c}')">${c==='all'?t('common.all'):categoryLabel(c)}</button>
  `).join('');
  const genderPills = ['all', ...GENDERS].map(g=>`
    <button class="tab-pill ${invFilter.gender===g?'active':''}" onclick="setInvFilter('gender','${g}')">${g==='all'?t('inv.genderAll'):genderLabel(g)}</button>
  `).join('');

  screen.innerHTML = `
    <div class="search-bar">
      <input class="input-field" id="inv-search" placeholder="${t('inv.search')}" value="${esc(invFilter.query)}" oninput="invFilter.query=this.value; renderInventoryList();">
      <button class="icon-btn" onclick="openScanner('global')" title="Scan">📷</button>
    </div>
    <div class="tab-pills" id="inv-gender-pills">${genderPills}</div>
    <div class="tab-pills" id="inv-pills">${pillsHtml}</div>
    <div id="inv-list"></div>
  `;
  renderInventoryList();
}
function setInvFilter(type, value){ invFilter[type] = value; renderInventory(); }

function getFilteredProducts(){
  const products = DB.get('products');
  const q = invFilter.query.trim().toLowerCase();
  const textFiltered = products.filter(p=>{
    if(invFilter.category!=='all' && p.category!==invFilter.category) return false;
    if(invFilter.gender!=='all' && p.gender!==invFilter.gender) return false;
    return true;
  });
  if(!q) return textFiltered.sort((a,b)=> (b.lastUpdated||'').localeCompare(a.lastUpdated||''));
  const exact = textFiltered.filter(p=>String(p.sku||'').toLowerCase()===q || String(p.barcode||'').toLowerCase()===q);
  const result = exact.length ? exact : textFiltered.filter(p=>
    (p.name||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q) || (p.color||'').toLowerCase().includes(q)
  );
  return result.sort((a,b)=> (b.lastUpdated||'').localeCompare(a.lastUpdated||''));
}

function renderInventoryList(){
  const list = getFilteredProducts();
  const el = document.getElementById('inv-list');
  if(!el) return;
  if(list.length===0){
    el.innerHTML = `<div class="empty-state"><div class="icon">👡</div><div>${t('inv.noProducts')}</div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="openAddProduct()">${t('inv.addFirst')}</button></div>`;
    return;
  }
  el.innerHTML = list.map(p=>productCardHTML(p)).join('');
}

function qtyClass(qty){
  qty = Number(qty);
  if(qty<=0) return 'qty-out';
  if(qty<=Number(SETTINGS.lowStockThreshold||3)) return 'qty-low';
  return 'qty-ok';
}
function qtyLabel(qty){
  qty = Number(qty);
  const unit = t('common.units');
  if(qty<=0) return SETTINGS.lang==='hi' ? 'खत्म' : 'Out';
  return qty + ' ' + unit;
}

function productCardHTML(p){
  const genderBadge = p.gender ? `<span class="badge badge-gray" style="margin-left:6px;">${genderLabel(p.gender)}</span>` : '';
  return `
    <div class="shoebox-card" onclick="openProductDetail('${p.id}')">
      <div class="shoebox-top">
        <div class="shoebox-main">
          <div class="shoebox-brand">${esc(p.brand)} · ${categoryLabel(p.category)}${genderBadge}</div>
          <div class="shoebox-model">${esc(p.name)}</div>
          <div class="shoebox-meta">${esc(p.color)} · SKU: ${esc(p.sku)}</div>
        </div>
        <div class="shoebox-tag">
          <div class="tag-size">${esc(p.size)}</div>
          <div class="tag-label">${SETTINGS.lang==='hi'?'साइज़':'SIZE'}</div>
        </div>
      </div>
      <div class="shoebox-bottom">
        <div class="shoebox-price">${money(p.sellingPrice)}</div>
        <div class="shoebox-qty ${qtyClass(p.qty)}">${qtyLabel(p.qty)}</div>
      </div>
    </div>
  `;
}

function submitProductForm(ev, editId){
  ev.preventDefault();
  const name = document.getElementById('pf-name').value.trim();
  const brand = document.getElementById('pf-brand').value.trim() || (SETTINGS.lang==='hi'?'सामान्य':'Generic');
  const category = document.getElementById('pf-category').value;
  const gender = document.getElementById('pf-gender').value;
  const season = document.getElementById('pf-season').value;
  const size = document.getElementById('pf-size').value.trim() || '-';
  const color = document.getElementById('pf-color').value.trim() || '-';
  const purchasePrice = parseFloat(document.getElementById('pf-purchase').value)||0;
  const sellingPrice = parseFloat(document.getElementById('pf-selling').value)||0;
  const mrp = parseFloat(document.getElementById('pf-mrp').value)||0;
  const qty = parseInt(document.getElementById('pf-qty').value)||0;
  const rack = document.getElementById('pf-rack').value.trim();
  const box = document.getElementById('pf-box').value.trim();
  const arrivalDate = document.getElementById('pf-arrival').value || new Date().toISOString().slice(0,10);
  const supplier = document.getElementById('pf-supplier').value.trim();
  let barcode = document.getElementById('pf-barcode').value.trim();
  if(!barcode) barcode = generateBarcodeValue();
  const notes = document.getElementById('pf-notes').value.trim();

  if(!name || !sellingPrice){ showToast(t('common.required')); return false; }

  const products = DB.get('products');

  if(editId){
    const idx = products.findIndex(p=>p.id===editId);
    if(idx>-1){
      products[idx] = Object.assign({}, products[idx], {
        name, brand, category, gender, season, size, color, purchasePrice, sellingPrice, mrp, supplier, rack, box, notes,
        arrivalDate: products[idx].arrivalDate,
        barcode: barcode || products[idx].barcode,
        lastUpdated: nowISO()
      });
      DB.set('products', products);
      showToast(t('common.success'));
    }
  } else {
    const sku = generateNextSKU(products);
    const newProduct = {
      id: uid('p_'), sku, barcode, name, brand, category, gender, season, size, color,
      purchasePrice, sellingPrice, mrp, qty, supplier, rack, box, arrivalDate,
      lastUpdated: nowISO(), notes
    };
    products.push(newProduct);
    DB.set('products', products);
    logStock(newProduct.id, newProduct.sku, 'in', qty, qty, SETTINGS.lang==='hi'?'नया प्रोडक्ट जोड़ा गया':'New product added', null);
    showToast(t('common.success'));
  }
  closeSheet();
  if(currentScreen==='inventory') renderInventory();
  if(currentScreen==='dashboard') renderDashboard();
  return false;
}

    en:{in:'Stock In', out:'Stock Out', adjust:'Adjustment', sale:'Sale', 'return':'Return', damage:'Damage'}
  };
  return (map[SETTINGS.lang]||map.en)[type] || type;
}

/* ---------------- STOCK IN / OUT / ADJUST ---------------- */
function logStock(productId, sku, type, qtyChange, qtyAfter, reason, refId){
  const logs = DB.get('stockLog');
  logs.push({id:uid('sl_'), dateISO:nowISO(), productId, sku, type, qtyChange, qtyAfter, reason:reason||'', refId:refId||null, employeeId: CURRENT_USER?CURRENT_USER.id:null});

function openStockMove(productId, mode){

  const labels = {

  };
  const title = labels[mode][SETTINGS.lang] || labels[mode].en;
  openSheet(`

    <div class="card" style="margin-bottom:16px;">
      <div style="font-weight:700;">${esc(p.brand)} ${esc(p.name)}</div>
      <div style="font-size:12.5px; color:var(--slate);">${esc(p.color)} · ${SETTINGS.lang==='hi'?'साइज़':'Size'} ${esc(p.size)} · ${SETTINGS.lang==='hi'?'मौजूदा':'Current'}: ${qtyLabel(p.qty)}</div>
    </div>
    <div class="input-group">
      <label class="input-label">${mode==='adjust' ? (SETTINGS.lang==='hi'?'नई मात्रा':'New Quantity') : (SETTINGS.lang==='hi'?'मात्रा':'Quantity')}</label>
      <input class="input-field" id="sm-qty" type="number" min="0" value="${mode==='adjust'?p.qty:1}" autofocus>
    </div>
    <div class="input-group">
      <label class="input-label">${SETTINGS.lang==='hi'?'कारण / नोट':'Reason / Note'} ${mode==='adjust'?'*':''}</label>
      <input class="input-field" id="sm-reason" placeholder="${mode==='out'?(SETTINGS.lang==='hi'?'जैसे: डैमेज, खराब':'e.g. damaged, return to supplier'):mode==='adjust'?(SETTINGS.lang==='hi'?'जैसे: गिनती में अंतर':'e.g. count correction'):(SETTINGS.lang==='hi'?'जैसे: नई खरीद':'e.g. new purchase')}">
    </div>
    <button class="btn btn-primary btn-block btn-lg" onclick="submitStockMove('${p.id}','${mode}')">${t('common.confirm')}</button>
  `);
}

function submitStockMove(productId, mode){
  const products = DB.get('products');
  const idx = products.findIndex(p=>p.id===productId);
  if(idx<0) return;
  const p = products[idx];
  const inputQty = parseInt(document.getElementById('sm-qty').value);
  const reason = document.getElementById('sm-reason').value.trim();
  if(isNaN(inputQty) || inputQty<0){ showToast(t('common.required')); return; }

  let qtyChange, qtyAfter;
  if(mode==='in'){ qtyChange = inputQty; qtyAfter = Number(p.qty)+inputQty; }
  else if(mode==='out'){ qtyChange = -inputQty; qtyAfter = Math.max(0, Number(p.qty)-inputQty); }
  else { qtyAfter = inputQty; qtyChange = inputQty - Number(p.qty); }

  products[idx] = Object.assign({}, p, {qty: qtyAfter, lastUpdated: nowISO()});
  DB.set('products', products);
  logStock(p.id, p.sku, mode, qtyChange, qtyAfter, reason, null);

  if(mode==='in'){
    const purchases = DB.get('purchases');
    purchases.push({id:uid('pu_'), dateISO:nowISO(), productId:p.id, sku:p.sku, qty:inputQty, costPrice:p.purchasePrice, supplier:p.supplier, notes:reason});
    DB.set('purchases', purchases);
  }

  closeSheet();
  showToast(t('common.success'));
  if(currentScreen==='inventory') renderInventory();
  if(currentScreen==='dashboard') renderDashboard();
}

function submitDamageStock(productId){

  const idx = products.findIndex(p=>p.id===productId);
  if(idx<0) return;
  const qty = parseInt(document.getElementById('dmg-qty').value)||0;
  const reason = document.getElementById('dmg-reason').value.trim();
  if(qty<=0 || !reason){ showToast(t('common.required')); return; }

  const damageLog = DB.get('damageStock');

/* =========================================================================
   SCANNER INTEGRATION
   1. Bluetooth HID barcode scanner — keyboard-wedge detection, works
      globally with no special permissions.
   2. USB barcode scanner — on Android, USB scanners in HID mode behave
      identically to Bluetooth HID scanners (both appear to the browser
      as a standard keyboard), so the same listener below handles both.
      True USB-serial scanners (not HID) cannot be read by a web page;
      if your scanner has a "USB HID / Keyboard mode" switch, use that.
   3. Phone camera scanner — BarcodeDetector API, with continuous scan
      mode and flashlight toggle.
   ========================================================================= */

/* ---- 1 & 2. Bluetooth/USB HID scanner (keyboard-wedge) listener ---- */
let _hidBuffer = '';
let _hidLastTime = 0;
let _hidKeyCount = 0;
let _hidIdleTimer = null;

function setupGlobalScannerListener(){
  document.addEventListener('keydown', (e)=>{
    const now = Date.now();
    const activeTag = document.activeElement && document.activeElement.tagName;
    const isTyping = activeTag==='INPUT' || activeTag==='TEXTAREA' || activeTag==='SELECT';

    // 60ms was too tight — Bluetooth HID scanners (most scanner "guns" sold
    // locally connect this way) have real inter-keystroke jitter, especially
    // over BLE, and a gap over 60ms was resetting the buffer mid-scan, so
    // the whole code got silently dropped with nothing added to cart. 120ms
    // is still far faster than a human typing, so it won't misfire on
    // manual typing, but gives real scanner hardware room to breathe.
    if(now - _hidLastTime > 120){ _hidBuffer = ''; _hidKeyCount = 0; }
    _hidLastTime = now;
    if(_hidIdleTimer) clearTimeout(_hidIdleTimer);

    // Scanner guns are commonly configured to send Tab as the end-of-scan
    // character instead of Enter (it's the default suffix on a lot of cheap
    // models) — this listener only ever accepted Enter, so a Tab-suffix
    // scanner's input just sat in the buffer and got reset on the next
    // keystroke gap, never reaching handleBarcodeScanned at all.
    if(e.key === 'Enter' || e.key === 'Tab'){
      const looksLikeBarcode = _hidBuffer.length >= 6 && !/\s/.test(_hidBuffer) && _hidKeyCount === _hidBuffer.length;
      if(looksLikeBarcode){
        if(e.key === 'Tab') e.preventDefault(); // don't let Tab jump focus away
        submitHidScan(_hidBuffer, isTyping);
      } else {
        _hidBuffer = ''; _hidKeyCount = 0;
      }
      return;
    }
    if(e.key.length === 1){
      _hidBuffer += e.key;
      _hidKeyCount++;
      // Fallback for scanners configured with NO suffix character at all:
      // if the buffer looks like a complete barcode and nothing new arrives
      // for 150ms, treat the scan as finished rather than waiting forever
      // for an Enter/Tab that will never come.
      _hidIdleTimer = setTimeout(()=>{
        if(_hidBuffer.length >= 6 && !/\s/.test(_hidBuffer) && _hidKeyCount === _hidBuffer.length){
          submitHidScan(_hidBuffer, document.activeElement && (document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='SELECT'));
        }
      }, 150);
    }
  }, true);
}

function submitHidScan(rawCode, isTyping){
  const code = rawCode;
  _hidBuffer = ''; _hidKeyCount = 0;
  if(_hidIdleTimer){ clearTimeout(_hidIdleTimer); _hidIdleTimer = null; }
  let mode = 'global';
  // Sale screen always wins, regardless of which field happens to have
  // focus (discount box, GST toggle, etc.) — a scan while New Sale is
  // open must add to cart, never fall through to product-detail just
  // because the cashier's cursor wasn't sitting in the search field.
  if(currentScreen === 'sale'){
    mode = 'sale';
  } else if(isTyping && document.activeElement && document.activeElement.id){
    mode = document.activeElement.id;
  }
  handleBarcodeScanned(code, mode);
}

function handleBarcodeScanned(code, mode){
  code = code.trim();
  if(!code) return;

  if(mode === 'sale' || (currentScreen === 'sale' && (!mode || mode === 'sale-search'))){
    addToCartByBarcode(code);
    return;
  }

  if(mode === 'picker'){
    const p = DB.get('products').find(x=>x.barcode===code || x.sku===code);
    if(p){
      playScanSuccessSound();
      closeSheet();
      if(window._pickerCallback) window._pickerCallback(p);
    } else {
      playScanErrorSound();
      showToast((SETTINGS.lang==='hi'?'कोई प्रोडक्ट नहीं मिला: ':'No product found: ')+code);
    }
    return;
  }

  if(mode && mode !== 'global'){
    const el = document.getElementById(mode);
    // Only fill fields that are actually meant to receive a scanned code —
    // text-type inputs whose id signals that purpose (barcode fields, the
    // picker/sale search boxes). Never blindly overwrite number fields like
    // quantity, price, or discount, or PIN fields — a scan firing while one
    // of those happens to be focused should not silently wipe its value.
    const scannableIdHints = ['barcode', 'search'];
    const isScannableField = el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA') &&
      (el.type === 'text' || el.type === 'search' || !el.type) &&
      scannableIdHints.some(hint => mode.toLowerCase().includes(hint));
    if(isScannableField){
      el.value = code;
      el.dispatchEvent(new Event('input'));
      playScanSuccessSound();
      showToast((SETTINGS.lang==='hi'?'स्कैन हुआ: ':'Scanned: ')+code);
      return;
    }
  }

  let p = DB.get('products').find(x=>x.barcode===code || x.sku===code);
  // Same fallback as addToCartByBarcode for legacy {B-prefix corrupted labels
  if(!p && code.startsWith('B') && code.length > 8){
    const withoutB = code.slice(1);
    p = DB.get('products').find(x=>x.barcode===withoutB || x.barcode==='TF'+withoutB || x.sku===withoutB);
  }
  if(p){
    playScanSuccessSound();
    nav('sale');
    addToCart(p.id);
  } else {
    playScanErrorSound();
    showToast((SETTINGS.lang==='hi'?'कोई प्रोडक्ट नहीं मिला: ':'No product found: ')+code);
  }
}

/* ---- 3. Camera scanner (with continuous mode + flashlight) ---- */
let _scannerStream = null;
let _scannerRAF = null;
let _scannerMode = 'global';
let _scannerContinuous = false;
let _scannerTrack = null;
let _torchOn = false;

async function openScanner(mode){
  _scannerMode = mode;
  _scannerContinuous = false;
  _torchOn = false;
  const overlay = document.getElementById('scanner-overlay');
  overlay.classList.add('active');
  const video = document.getElementById('scanner-video');

  if(!('BarcodeDetector' in window)){
    showToast(SETTINGS.lang==='hi' ? 'इस फ़ोन के ब्राउज़र में कैमरा स्कैन सपोर्ट नहीं है। Bluetooth स्कैनर इस्तेमाल करें।' : 'Camera scan not supported on this browser. Use Bluetooth scanner instead.', 3500);
    closeScanner();
    return;
  }

  try{
    _scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = _scannerStream;
    await video.play();
    _scannerTrack = _scannerStream.getVideoTracks()[0];
    updateTorchButtonVisibility();

    const detector = new BarcodeDetector({formats:['code_128','ean_13','ean_8','upc_a','upc_e','code_39','qr_code']});
    const scanLoop = async ()=>{
      if(!overlay.classList.contains('active')) return;
      try{
        const codes = await detector.detect(video);
        if(codes && codes.length>0){
          const value = codes[0].rawValue;
          const mode = _scannerMode;
          playScanSuccessSound();
          if(_scannerContinuous){
            handleBarcodeScanned(value, mode);
            setTimeout(()=>{ if(overlay.classList.contains('active')) _scannerRAF = requestAnimationFrame(scanLoop); }, 900);
            return;
          }
          closeScanner();
          handleBarcodeScanned(value, mode);
          return;
        }
      }catch(err){ /* ignore single-frame detection errors */ }
      _scannerRAF = requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(err){
    showToast(SETTINGS.lang==='hi' ? 'कैमरा एक्सेस नहीं मिला' : 'Could not access camera');
    closeScanner();
  }
}

function updateTorchButtonVisibility(){
  const btn = document.getElementById('scanner-torch-btn');
  if(!btn) return;
  const capabilities = _scannerTrack && _scannerTrack.getCapabilities ? _scannerTrack.getCapabilities() : {};
  btn.style.display = capabilities.torch ? 'flex' : 'none';
}
function toggleTorch(){
  if(!_scannerTrack) return;
  _torchOn = !_torchOn;
  try{
    _scannerTrack.applyConstraints({advanced:[{torch:_torchOn}]});
    const btn = document.getElementById('scanner-torch-btn');
    if(btn) btn.style.background = _torchOn ? 'var(--green-deep)' : 'rgba(255,255,255,0.92)';
  }catch(e){ showToast(SETTINGS.lang==='hi'?'फ्लैश सपोर्ट नहीं है':'Flashlight not supported on this device'); }
}
function toggleContinuousScan(){
  _scannerContinuous = !_scannerContinuous;
  const btn = document.getElementById('scanner-continuous-btn');
  if(btn) btn.style.background = _scannerContinuous ? 'var(--green-deep)' : 'rgba(255,255,255,0.92)';
  showToast(_scannerContinuous ? (SETTINGS.lang==='hi'?'लगातार स्कैन मोड ऑन':'Continuous scan mode ON') : (SETTINGS.lang==='hi'?'लगातार स्कैन मोड ऑफ':'Continuous scan mode OFF'));
}

function closeScanner(){
  const overlay = document.getElementById('scanner-overlay');
  overlay.classList.remove('active');
  if(_scannerRAF) cancelAnimationFrame(_scannerRAF);
  if(_scannerStream){
    _scannerStream.getTracks().forEach(tr=>tr.stop());
    _scannerStream = null;
  }
  _scannerTrack = null;
  _torchOn = false;
  _scannerContinuous = false;
}

function renderSaleSearchResults(q){
  const box = document.getElementById('sale-search-results');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML=''; return; }
  const products = DB.get('products');

  // A short SKU (1, 2, 3...) or barcode typed into search must match that
  // ONE product exactly — the old search concatenated name+brand+sku+barcode
  // +color with no separator and did a plain substring match, so typing "3"
  // matched every product whose barcode/name/anything merely contained a
  // "3" somewhere. Exact SKU/barcode match now wins outright; only when
  // there's no exact match do we fall back to a fuzzy name/brand/color
  // search (kept separate from sku/barcode on purpose).
  const exact = products.filter(p=>Number(p.qty)>0 && (String(p.sku).toLowerCase()===q || String(p.barcode).toLowerCase()===q));
  const matches = exact.length ? exact : products.filter(p=>
    Number(p.qty)>0 && [p.name,p.brand,p.color].filter(Boolean).join(' ').toLowerCase().includes(q)
  ).slice(0,8);
  if(matches.length===0){ box.innerHTML = `<div class="empty-state" style="padding:20px;">${t('common.noResults')}</div>`; return; }
  box.innerHTML = matches.map(p=>`
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick='addToCart(${JSON.stringify(p.id)})'>
      <div><div style="font-weight:700; font-size:13.5px;">${esc(p.brand)} ${esc(p.name)}</div>
      <div style="font-size:12px; color:var(--slate);">${esc(p.color)} · ${SETTINGS.lang==='hi'?'साइज़':'Size'} ${esc(p.size)} · ${qtyLabel(p.qty)}</div></div>
      <div style="font-weight:700;">${money(p.sellingPrice)}</div>
    </div>
  `).join('');
}

function addToCart(productId){
  const p = DB.get('products').find(x=>x.id===productId);
  if(!p) return;
  if(Number(p.qty)<=0){ showToast(SETTINGS.lang==='hi'?'यह प्रोडक्ट स्टॉक में नहीं है':'This product is out of stock'); playScanErrorSound(); return; }
  const existing = cart.find(c=>c.productId===productId);
  if(existing){
    if(existing.qty >= p.qty){ showToast(SETTINGS.lang==='hi'?'उपलब्ध स्टॉक से ज़्यादा नहीं':'Cannot exceed available stock'); playScanErrorSound(); return; }
    existing.qty++;
  } else {
    cart.push({productId:p.id, sku:p.sku, name:`${p.brand} ${p.name} (${p.color}, ${p.size})`, qty:1, price:Number(p.sellingPrice), cost:Number(p.purchasePrice), maxQty:Number(p.qty)});
  }
  document.getElementById('sale-search').value='';
  document.getElementById('sale-search-results').innerHTML='';
  renderSaleScreen();
  playScanSuccessSound();
  showToast((SETTINGS.lang==='hi'?'जोड़ा गया: ':'Added: ')+p.brand+' '+p.name);
}
function addToCartByBarcode(code){
  let p = DB.get('products').find(x=>x.barcode===code || x.sku===code);
  // Fallback: if not found, try stripping a leading 'B' — older labels printed
  // via the buggy {B-prefix ESC/POS command show the barcode number starting
  // with 'B' in the human-readable text (the '{' got lost, 'B' printed literally),
  // so the scanner reads e.g. 'B890801285287' but the DB has 'TF890801285287'.
  if(!p && code.startsWith('B') && code.length > 8){
    const withoutB = code.slice(1);
    p = DB.get('products').find(x=>x.barcode===withoutB || x.barcode==='TF'+withoutB || x.sku===withoutB);
  }
  if(!p){ showToast((SETTINGS.lang==='hi'?'कोई प्रोडक्ट नहीं मिला':'No product found')+': '+code); playScanErrorSound(); return; }
  addToCart(p.id);
}
function changeCartQty(i, delta){
  const it = cart[i];
  const newQty = it.qty + delta;
  if(newQty<=0){ cart.splice(i,1); }
  else if(newQty > it.maxQty){ showToast(SETTINGS.lang==='hi'?'उपलब्ध स्टॉक से ज़्यादा नहीं':'Cannot exceed available stock'); return; }
  else { it.qty = newQty; }
  renderSaleScreen();
}
function removeCartItem(i){ cart.splice(i,1); renderSaleScreen(); }
function clearCart(){ cart=[]; renderSaleScreen(); }
function cartSubtotal(){ return cart.reduce((s,it)=>s+it.qty*it.price,0); }

/* Simple in-app calculator — opens as a sheet so the shopkeeper can do
   quick calculations (e.g. work out a percentage discount mentally) without
   leaving the sale screen or opening the phone's separate calculator app. */
function openCalculator(){
  openSheet(`
    <div class="sheet-header"><h2>🧮 ${SETTINGS.lang==='hi'?'कैलकुलेटर':'Calculator'}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div style="background:var(--charcoal); color:#fff; border-radius:var(--radius); padding:18px 16px; text-align:right; margin-bottom:12px;">
      <div id="calc-expr" style="font-size:13px; color:rgba(255,255,255,0.5); min-height:18px; margin-bottom:4px;"></div>
      <div id="calc-display" style="font-size:32px; font-family:var(--font-display); font-weight:700;">0</div>
    </div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;">
      ${[['C','','','⌫'],['7','8','9','÷'],['4','5','6','×'],['1','2','3','−'],['0','.','%','+'],['','','','=']].map(row=>
        row.map(k=>k===''?`<div></div>`:`<button onclick="calcKey('${k}')" style="
          padding:18px 0; border-radius:var(--radius-sm); border:none; font-size:18px; font-family:var(--font-display); font-weight:600; cursor:pointer;
          background:${k==='='?'var(--green-deep)':['÷','×','−','+','%'].includes(k)?'var(--peach-deep)':k==='C'?'#c0392b':'var(--white)'};
          color:${k==='='?'#fff':'var(--charcoal)'};
        ">${k}</button>`).join('')
      ).join('')}
    </div>
  `);
  window._calcVal = '0'; window._calcExpr = ''; window._calcNewNum = true; window._calcOp = '';
}
function calcKey(k){
  const disp = document.getElementById('calc-display');
  const expr = document.getElementById('calc-expr');
  if(k==='C'){ window._calcVal='0'; window._calcExpr=''; window._calcNewNum=true; window._calcOp=''; }
  else if(k==='⌫'){
    window._calcVal = window._calcVal.length>1 ? window._calcVal.slice(0,-1) : '0';
    window._calcNewNum = false;
  }
  else if(k==='='){
    if(window._calcOp && !window._calcNewNum){
      const a=parseFloat(window._calcPrev||0), b=parseFloat(window._calcVal||0);
      let res=0;
      if(window._calcOp==='+') res=a+b;
      else if(window._calcOp==='−') res=a-b;
      else if(window._calcOp==='×') res=a*b;
      else if(window._calcOp==='÷') res=b!==0?a/b:0;
      window._calcVal = String(Math.round(res*100)/100);
      window._calcExpr = ''; window._calcOp = ''; window._calcNewNum = true;
    }
  }
  else if(k==='%'){
    window._calcVal = String(Math.round(parseFloat(window._calcVal||0)/100*100)/100);
  }
  else if(['+','−','×','÷'].includes(k)){
    window._calcPrev = window._calcVal;
    window._calcOp = k;
    window._calcExpr = window._calcVal + ' ' + k;
    window._calcNewNum = true;
  }
  else if(k==='.'){
    if(!window._calcVal.includes('.')) window._calcVal += '.';
    window._calcNewNum = false;
  }
  else {
    if(window._calcNewNum){ window._calcVal = k; window._calcNewNum=false; }
    else window._calcVal = window._calcVal==='0' ? k : window._calcVal+k;
  }
  if(disp) disp.textContent = window._calcVal;
  if(expr) expr.textContent = window._calcExpr;
}

let _discountType = 'flat'; // 'flat' | 'pct'
function setDiscountType(type){
  _discountType = type;
  document.getElementById('disc-type-flat').className = type==='flat' ? 'active' : '';
  document.getElementById('disc-type-pct').className = type==='pct' ? 'active' : '';
  document.getElementById('cart-discount').placeholder = type==='pct' ? '0-100' : '0';
  renderCartTotals();
}
function getDiscountAmount(subtotal){
  const val = parseFloat(document.getElementById('cart-discount')?.value)||0;
  if(_discountType==='pct') return Math.round(subtotal * Math.min(val,100) / 100);
  return val;
}
function getDiscountPct(subtotal, discountAmt){
  if(subtotal<=0) return 0;
  return Math.round(discountAmt/subtotal*100);
}

function renderCartTotals(){
  const subtotal = cartSubtotal();
  const discount = getDiscountAmount(subtotal);
  const afterDiscount = Math.max(0, subtotal-discount);
  const gstOn = SETTINGS.gstEnabled && document.getElementById('cart-gst-toggle') && document.getElementById('cart-gst-toggle').checked;
  const gstAmount = gstOn ? afterDiscount * (Number(SETTINGS.gstPercent||0)/100) : 0;
  const total = afterDiscount + gstAmount;
  const discPct = _discountType==='pct'
    ? (parseFloat(document.getElementById('cart-discount')?.value)||0)
    : getDiscountPct(subtotal, discount);

  const breakdown = document.getElementById('cart-breakdown');
  if(breakdown){
    breakdown.innerHTML = `
      <div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px;">
        <span style="color:var(--slate);">${t('sale.subtotal')}</span><span>${money(subtotal)}</span>
      </div>
      ${discount>0?`<div style="display:flex; justify-content:space-between; font-size:13.5px; color:var(--terracotta); margin-bottom:4px;"><span>${t('sale.discount')} ${discPct>0?'('+discPct+'% OFF)':''}</span><span>-${money(discount)}</span></div>`:''}
      ${gstOn?`<div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px;"><span style="color:var(--slate);">${t('sale.gst')} (${SETTINGS.gstPercent}%)</span><span>+${money(gstAmount)}</span></div>`:''}
      <div style="display:flex; justify-content:space-between; font-family:var(--font-display); font-weight:800; font-size:19px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line);">
        <span>${t('sale.total')}</span><span>${money(total)}</span>
      </div>
    `;
  }
}

/* ---------------- CHECKOUT ---------------- */
function openCheckout(){
  if(cart.length === 0){
    showToast(SETTINGS.lang==='hi' ? '⚠️ कार्ट खाली है — पहले प्रोडक्ट जोड़ें' : '⚠️ Cart is empty — add a product first');
    return;
  }
  const subtotal = cartSubtotal();
  const discount = getDiscountAmount(subtotal);

  const paymentButtons = PAYMENT_MODES.map(m=>`

  `).join('');

  openSheet(`
    <div class="sheet-header"><h2>${t('sale.checkout')}</h2><button class="icon-btn" onclick="closeSheet()">✕</button></div>
    <div class="input-group">
      <label class="input-label">${t('sale.customerName')} ${t('common.optional')}</label>
      <input class="input-field" id="co-name" placeholder="${SETTINGS.lang==='hi'?'जैसे: रीमा शर्मा':'e.g. Reema Sharma'}" oninput="suggestCheckoutCustomers(this.value)">
      <div id="co-name-suggestions"></div>
    </div>
    <div class="input-group"><label class="input-label">${t('sale.customerPhone')} ${t('common.optional')}</label>

      ${discount>0?`<div style="display:flex; justify-content:space-between; font-size:13.5px; color:var(--terracotta); margin-bottom:4px;"><span>${t('sale.discount')} ${discPct>0?'('+discPct+'% OFF)':''}</span><span>-${money(discount)}</span></div>`:''}
      ${gstOn?`<div style="display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px;"><span>${t('sale.gst')} (${SETTINGS.gstPercent}%)</span><span>+${money(gstAmount)}</span></div>`:''}

      <label class="input-label">${t('sale.amountPaid')}</label>
      <input class="input-field" id="co-amount-paid" type="number" min="0" step="0.01" value="${total.toFixed(2)}" oninput="updateCreditDueDisplay(${total})">
    </div>

    <button class="btn btn-primary btn-block btn-lg" onclick="completeSale()">✓ ${t('sale.completeSale')}</button>

}
function updateCreditDueDisplay(total){

    <div style="display:flex; justify-content:space-between; align-items:center;">

      <span style="font-weight:800; color:var(--terracotta); font-size:16px;">${money(due)}</span>

function completeSale(){
  if(cart.length===0){
    showToast(SETTINGS.lang==='hi' ? '⚠️ कार्ट खाली है — पहले प्रोडक्ट जोड़ें' : '⚠️ Cart is empty — add a product first');
    closeSheet();
    return;
  }
  const customerName = document.getElementById('co-name').value.trim();
  const customerPhone = document.getElementById('co-phone').value.trim();
  const paymentMode = window._payMode || 'cash';
  const subtotal = cartSubtotal();
  // Recompute discount/GST fresh from the live cart-screen fields right now,
  // instead of trusting numbers captured whenever the checkout sheet first
  // opened. The checkout sheet is an overlay — the underlying sale-screen
  // discount/GST inputs stay alive in the DOM the whole time, so re-reading
  // them here is safe and removes any window where a delay (a printer
  // reconnect dialog, a slow tap, anything) lets a stale number through.
  const discount = getDiscountAmount(subtotal);
  const discountPct = _discountType==='pct'
    ? (parseFloat(document.getElementById('cart-discount')?.value)||0)
    : getDiscountPct(subtotal, discount);
  const gstOn = SETTINGS.gstEnabled && document.getElementById('cart-gst-toggle') && document.getElementById('cart-gst-toggle').checked;
  const afterDiscount = Math.max(0, subtotal-discount);
  const gstAmount = gstOn ? afterDiscount * (Number(SETTINGS.gstPercent||0)/100) : 0;
  const total = afterDiscount + (gstAmount||0);
  // Hard guard: a non-empty cart must never save as a ₹0 bill. If this ever
  // fires it means subtotal itself came back 0 with items still in cart —
  // stop and surface it instead of silently recording a broken sale.
  if(total <= 0 && subtotal > 0){
    showToast(SETTINGS.lang==='hi' ? '⚠️ बिल राशि में गड़बड़ी, दोबारा कोशिश करें' : '⚠️ Bill amount error, please try again');
    return;
  }

  const amountPaid = parseFloat(document.getElementById('co-amount-paid').value);
  const validAmountPaid = isNaN(amountPaid) ? total : amountPaid;
  const creditAmount = Math.max(0, Math.round((total - validAmountPaid)*100)/100);
  if(creditAmount > 0 && !customerName){
    showToast(SETTINGS.lang==='hi' ? '⚠️ उधार दर्ज करने के लिए ग्राहक का नाम भरें' : '⚠️ Enter customer name to record credit');
    return;
  }

  let customerId = window._selectedCustomerId || null;
  if(!customerId && customerName){
    const customers = DB.get('customers');
    let existing = customers.find(c=>c.name.toLowerCase()===customerName.toLowerCase() && (c.phone||'')===customerPhone);
    if(!existing){
      existing = {id:uid('cu_'), name:customerName, phone:customerPhone, address:'', outstandingBalance:0, createdAt:nowISO()};
      customers.push(existing);
    }
    if(creditAmount > 0){ existing.outstandingBalance = Number(existing.outstandingBalance||0) + creditAmount; }
    DB.set('customers', customers);
    customerId = existing.id;
  } else if(customerId && creditAmount > 0){
    const customers = DB.get('customers');
    const idx = customers.findIndex(c=>c.id===customerId);
    if(idx>-1){ customers[idx].outstandingBalance = Number(customers[idx].outstandingBalance||0) + creditAmount; DB.set('customers', customers); }
  }

  const sales = DB.get('sales');
  const billNo = 'TF' + (sales.length+1001);
  const sale = {
    id: uid('s_'), billNo, dateISO: nowISO(),
    items: cart.map(it=>({productId:it.productId, sku:it.sku, name:it.name, qty:it.qty, price:it.price, cost:it.cost})),
    subtotal, discount, discountPct: discountPct||0, gstAmount: gstAmount||0, gstPercent: (gstAmount>0 ? SETTINGS.gstPercent : 0),
    total, amountPaid: validAmountPaid, creditAmount,
    customerName, customerPhone, customerId, paymentMode,
    employeeId: CURRENT_USER ? CURRENT_USER.id : null, employeeName: CURRENT_USER ? CURRENT_USER.name : '',
    shopId: _selectedShopId || 'shop1'
  };
  sales.push(sale);
  DB.set('sales', sales);

  const products = DB.get('products');
  cart.forEach(it=>{
    const idx = products.findIndex(p=>p.id===it.productId);
    if(idx>-1){
      products[idx].qty = Math.max(0, Number(products[idx].qty)-it.qty);
      products[idx].lastUpdated = nowISO();
      logStock(it.productId, it.sku, 'sale', -it.qty, products[idx].qty, 'Bill #'+billNo, sale.id);
    }
  });
  DB.set('products', products);

  cart = [];
  closeSheet();
  // Save last completed sale for reprint in case printer was disconnected
  localStorage.setItem('tf_last_sale', JSON.stringify(sale));
  showSaleSuccess(sale);
}

  openSheet(`

/* Builds a plain-text bill summary and opens WhatsApp (via wa.me) with it
   pre-filled to the customer's number — no backend/SMS service needed,
   works entirely from the phone the shop is already using. */
function sendBillViaWhatsApp(sale){
  if(!sale.customerPhone){ showToast(SETTINGS.lang==='hi'?'ग्राहक का फ़ोन नंबर नहीं है':'No customer phone number on file'); return; }
  const shopName = SETTINGS.shopName || 'Tariq Footwear';
  const lines = [];
  lines.push(`*${shopName}*`);
  lines.push(`Bill #${sale.billNo} — ${fmtDateTime(sale.dateISO)}`);
  lines.push('');
  sale.items.forEach(it=>lines.push(`${it.name} — ${it.qty} x ₹${it.price} = ₹${it.qty*it.price}`));
  lines.push('');
  lines.push(`Total: ₹${sale.total}`);
  if(Number(sale.creditAmount||0) > 0){
    lines.push(`Paid: ₹${sale.amountPaid}`);
    lines.push(`*Udhaar / Credit Due: ₹${sale.creditAmount}*`);
  }
  lines.push('');
  lines.push('Thank you for shopping with us!');
  const text = encodeURIComponent(lines.join('\n'));
  let phone = String(sale.customerPhone).replace(/\D/g,'');
  if(phone.length===10) phone = '91'+phone; // assume Indian number if no country code given
  window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
}
